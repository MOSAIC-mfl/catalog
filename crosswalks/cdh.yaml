# Crosswalk: CGIAR Climate Data Hub (CDH) record YAML -> MOSAIC record (standard v0.2).
#
# Direction: READING CDH records into MOSAIC (the API's CDH translator uses this file).
# Since v0.2 the MOSAIC core uses the CDH core names and shapes, so almost every field is the
# same; what differs is listed here. Checked against cdh-metadata-standard v0.5.0 (commit
# 8cec4dc) and cdh-catalog (commit 18e5333).
#
# Rules: nothing is invented. A CDH value without a MOSAIC place is reported by the translator;
# it is never silently dropped.
source: cdh
source_version: v0.5.0

same: [id, title, description, note, resource_type, version, previous_version, deprecated, parent, series,
       keywords, commodities, spatial, temporal, license, access, access_note, attribution, contact, citation,
       doi, funding, related_publications, additional_links, data, additional_assets, structures, processing,
       created, updated]

fields:                                     # only what is not `same`
  cdh_schema_version: schema_version        # the MOSAIC standard version the translation follows
  cdh.domain: themes                        # via vocabularies.domain_to_theme
  cdh.usage: usage                          # same fields, in the core
  spatial.geography: spatial.geography      # CDH slug -> M49 code (CDH vocab/geography.json) -> our ISO3 / m49:<code>
  access: access                            # CDH omits it when public -> MOSAIC writes public explicitly
  data[]: data[]                            # same fields; access_method (download / service) and kind are
                                            # derived from locations, media_type and structures, and listed in derived
  extensions: extensions                    # climate -> climate@0.2.0 (same fields); other CDH extensions are reported

vocabularies:
  domain_to_theme:                          # CDH domain -> MOSAIC theme (all eight have one)
    adaptation: climate-adaptation
    agricultural-production: agrobiodiversity-crops
    boundaries: boundaries-admin-units
    climate: climate
    hydrology: water-hydrology
    land: land-cover-land-use
    mitigation: climate-mitigation
    socioeconomic: socio-economic-livelihoods
  access:
    public: public
    restricted: restricted
    non-public: non-public
  contact_role:                             # same ids; MOSAIC adds host and funder
    licensor: licensor
    producer: producer
    processor: processor
    point-of-contact: point-of-contact
    maintainer: maintainer
