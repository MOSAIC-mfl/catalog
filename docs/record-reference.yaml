# MOSAIC record — every field of the standard v0.2, with its level and meaning.
# Generated by scripts/build_reference.py from schema/. Reference only: a real record uses
# only the fields it knows (template: docs/record-template.yaml). Values are examples
# (mostly from the synthetic test record tests/fixtures/valid/complete.yaml).
#
# [MÍNIMO] required to be complete · [RECOMENDADO] warning if missing
# [PERFIL MOSAIC] warning until enforced · [OPCIONAL] · [AUTOMÁTICO] filled by the build

# [AUTOMÁTICO] (lo escribe el build si falta) — texto. Version of the MOSAIC standard this record follows (e.g. 0.2.0). Written by the build
schema_version: "0.2.0"
# [MÍNIMO] — texto. Permanent identifier, unique in its catalogue; never reused or changed. MOSAIC uses MFL-YYYY-NNN; CDH-style lowercase ids are also valid
id: "MFL-2099-001"
# [MÍNIMO] — texto. Human-readable title of the resource
title: "Test land cover map"
# [MÍNIMO] — texto. Canonical human- and AI-readable summary of the resource
description: "Synthetic record used by the test suite."
# [OPCIONAL] — texto. Caveats, warnings, or interpretation-critical remarks not captured in description
note: "Pixel area shrinks with latitude; reproject before computing areas."
# [MÍNIMO] — texto (vocabulario) · vocab/resource_type.json: dataset, service, document, software, model. Kind of resource the record describes (vocab/resource_type.json)
resource_type: "dataset"
# [OPCIONAL] — texto. Version label of this release of the resource. The source's own label when it has one; otherwise a counter from 1. Letters, digits, dots, underscores, and hyphens only, since it becomes part of a superseded release's id. Not compared or sorted - order comes from previous_version
version: "v2"
# [OPCIONAL] — texto. version of the predecessor record (same id), when this supersedes an earlier release
previous_version: ""
# [OPCIONAL] — sí/no. true when a newer release (same id) supersedes this record
deprecated: null
# [OPCIONAL] — texto. id of the parent record, when this record is a child representation of it. Omit on top-level records. Must resolve to exactly one catalog record, must not equal this record's id, and must not create a parent cycle
parent: ""
# [OPCIONAL] — objeto. Program, initiative, or product brand the resource was published under (e.g. Africa Agriculture Adaptation Atlas, MapSPAM, ACASA). Members may span domains, resolutions, and resource types. Not for grouping representations or releases of a single resource. `name` is the grouping key - use the same spelling on every record in the series; `url` is the series landing page
series:
  # [OPCIONAL] · obligatorio en su objeto — texto
  name: ""
  # [OPCIONAL] — texto
  url: ""
# [OPCIONAL] — lista de texto. Languages of the content, ISO 639-1 codes (en, es, fr)
language: ["en", "es"]
# [MÍNIMO] — lista de texto (vocabulario). MOSAIC themes (vocab/themes.json); the first one is the primary theme. CDH domains map to these
themes: ["land-cover-land-use", "pressures-drivers"]
# [RECOMENDADO] — lista de texto o objeto. Free-text search terms. Each item is either a plain string, or an object linking the term to an external vocabulary/ontology (e.g., AGROVOC, GEMET)
keywords: ["land cover", {"term": "land cover", "scheme": "agrovoc", "uri": "http://aims.fao.org/aos/agrovoc/c_37897"}]
# [OPCIONAL] — lista de texto. Agricultural commodities the resource describes (crops, livestock), as ids of the CDH commodity vocabulary (e.g. maize, cattle)
commodities: ["maize", "cattle"]
# [OPCIONAL] — objeto. Use guidance: what the resource was produced for, and what to avoid. Omit when there is nothing to say
usage:
  # [OPCIONAL] — lista de texto. Uses the resource was produced for (illustrative, never exhaustive)
  intended_uses: null
  # [OPCIONAL] — lista de objeto. Uses to avoid, each with a reason and an optional alternative
  not_recommended_for:
    -
      # [OPCIONAL] · obligatorio en su objeto — texto
      use: ""
      # [OPCIONAL] · obligatorio en su objeto — texto
      reason: ""
      # [OPCIONAL] — texto
      use_instead: ""
# [RECOMENDADO] — objeto
spatial:
  # [RECOMENDADO] — lista de 4 números o lista de lista de 4 números. Spatial extent. A single bounding box, or a list of boxes for disjoint coverage - each box is a real area covered, in any order; do not include an overall/union box. 2D = [west, south, east, north] = [xmin, ymin, xmax, ymax]; 3D = [west, south, min_z, east, north, max_z]. WGS84 (EPSG:4326); elevation in metres
  bbox: [-80, -12, -70, -2]
  # [OPCIONAL] — texto. Coordinate reference system of the data: an authority code such as EPSG:4326 or ESRI:54052, or an OGC CRS URI. A PROJ or WKT string only when no code exists
  crs: "EPSG:4326"
  # [RECOMENDADO] — lista de texto (vocabulario) · vocab/geography.json: 278 códigos (ver hoja Vocabularios). Countries and regions: ISO 3166-1 alpha-3 (PER), UN M49 regions (m49:419) or global (vocab/geography.json)
  geography: ["PER", "m49:419"]
  # [PERFIL MOSAIC] (obligatorio si se activa el perfil MOSAIC) — lista de texto (vocabulario) · vocab/landscapes.json: COL-CUM, PER-PCL, SEN-FK, CIV-NZ, TUN-NW, ETH-OG, KEN-LVB, KEN-LEI, ZWE-MB, IND-CH, MEK-3S. MFL living landscapes the resource covers (vocab/landscapes.json). Required by the MOSAIC profile
  landscapes: ["PER-PCL"]
  # [OPCIONAL] — objeto. Spatial resolution, for discovery. Grids also describe it in structures (x/y dimensions)
  resolution:
    # [OPCIONAL] — número
    value: 30
    # [OPCIONAL] — texto (lista cerrada) · m, km, degree, arcsec, arcmin
    unit: "m"
    # [OPCIONAL] — texto. As the source states it (e.g. district level, 1:50 000)
    text: ""
# [RECOMENDADO] — objeto. Coverage extent, precision-aware. Use `date` for a single instant or period (date: 2020 = the year 2020), or `start_date` + `end_date` for a span (end_date: null = open-ended). `date` and `start_date`/`end_date` are mutually exclusive. 
temporal:
  # [RECOMENDADO] (temporal.date o temporal.start_date) — texto. A single instant or period; its precision sets the granularity (year, month, day, or datetime)
  date: ""
  # [RECOMENDADO] (temporal.date o temporal.start_date) — texto. Start of a span
  start_date: "2020"
  # [OPCIONAL] — texto (puede ser null). End of a span; null for an open-ended series
  end_date: ""
  # [RECOMENDADO] (unknown si la fuente no lo dice) — texto (vocabulario) · vocab/update_frequency.json: static, continual, daily, weekly, monthly, quarterly, semiannual, seasonal, annual, irregular, unknown. How often the resource gains new data (vocab/update_frequency.json)
  update_frequency: "annual"
  # [OPCIONAL] — texto. Period as the source states it, when it has no precise dates
  text: "2020 onwards"
# [MÍNIMO] — texto. Licence of the data as an SPDX expression (CC-BY-4.0, CC0-1.0, CC-BY-4.0 OR CC0-1.0). Without an SPDX code: LicenseRef-<name>, with its text in license_text and, when it exists, a link in additional_links (rel: license)
license: "CC-BY-4.0"
# [OPCIONAL] (obligatorio si license es LicenseRef-… y no hay enlace (additional_links rel: license)) — texto. Text of the licence or terms when there is no SPDX code
license_text: "Free download from the source; no formal licence stated."
# [MÍNIMO] — texto (vocabulario) · vocab/access.json: public, restricted, non-public. Access to the data: public, restricted (on request or with an account) or non-public (catalogued, not available outside the holders). DCAT / EU access-rights aligned
access: "public"
# [MÍNIMO] (obligatorio si access es restricted o non-public) — texto. Human-readable access conditions or instructions. Required when access is restricted or non-public; maps to schema.org conditionsOfAccess
