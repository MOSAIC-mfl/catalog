# [OPCIONAL] — texto. Credit line reusers should reproduce: wording a license or upstream source requires, or the credit the producer asks for. One short statement; do not restate citation. Maps to schema.org creditText
attribution: "Contains modified Copernicus Sentinel data (2024)."
