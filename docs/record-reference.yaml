# [OPCIONAL] — lista de objeto. The data dictionary, one structure per layout, after Frictionless Data Package resources: each structure is a self-contained set of dimensions, variables, and foreign keys. A record with one layout has one structure. Names are unique within a structure and may repeat across structures, so two tables can each have a column named value. Every data[] entry names the structures it holds
structures:
  -
    # [OPCIONAL] · obligatorio en su objeto — texto. Structure name, unique within structures[]; data[].structures refers to it
    name: "GeoTIFF"
    # [OPCIONAL] — lista de objeto. The dimensions every variable in this structure has. Omit it when the variables vary only over the horizontal grid
    dimensions:
      -
        # [OPCIONAL] · obligatorio en su objeto — texto. Axis name. Must not be "variable": measures are not axes and belong in variables[]; href_template refers to them via the reserved {variable} token
        name: ""
        # [OPCIONAL] — texto. What the dimension is; define coded values here, or via reference_system or a sidecar
        description: ""
        # [OPCIONAL] · obligatorio en su objeto — texto. Dimension type. Reserved values change how the dimension is read: `temporal` (an axis of ISO 8601 dates or instants; a structure may declare several), `z` (a vertical axis - depth, height, or pressure level - at most one per structure), `x`, `y`, and `xy` (the horizontal axes in spatial.crs, as STAC datacube spatial x/y and CF axis X/Y: with a numeric step and unit they are a regular grid, xy when both axes share one spacing, else x and y as a pair with their own; without step they are a table's coordinate columns), and `location` (a column identifying a place, such as an admin, basin, station, or H3 cell code - a key, not an axis of space). Any other value names a domain axis after what it varies (crop, scenario, season). `spatial` and `geometry` are rejected, as are lat/lon spellings, so a coordinate axis cannot silently become a domain axis. Lowercase; aliases of `temporal` are rejected too
        type: ""
        # [OPCIONAL] — texto. Vocabulary or spatial index the values are coded against; prefer a resolvable URI when one exists (an AGROVOC concept scheme, a boundary set such as https://gadm.org/, https://h3geo.org/)
        reference_system: ""
        # [OPCIONAL] — lista de texto o número o sí/no. Allowed values along the dimension
        values: null
        # [OPCIONAL] — texto o número. Spacing between consecutive values, as in STAC datacube: an ISO 8601 duration (P1Y, P3M, PT6H) on a type: temporal dimension, a number in unit on x, y, or xy. Not the length of the period a value represents. On a temporal axis, required with extent and omitted when irregular. On a horizontal axis, present for a regular grid and absent for a table's coordinate columns
        step: ""
        # [OPCIONAL] — texto o lista de número. First and last value of a regular axis, in place of listing every value, as in STAC datacube. On a type: temporal dimension, two ISO 8601 strings at one precision (YYYY, YYYY-MM, YYYY-MM-DD, or an RFC 3339 date-time), no coarser than the step, start before end; requires step and excludes values. On x, y, or xy, the native [min, max] of the axis in unit and spatial.crs, optional, for a grid whose edges spatial.bbox does not give exactly, such as a projected CRS
        extent: null
        # [OPCIONAL] — texto. Unit of measurement for the values, in UDUNITS-2 (UCUM only for what UDUNITS-2 cannot express). Required on x, y, and xy (degree, m, km) and on z (cm, m, hPa); useful on any numeric domain axis. Not a substitute for reference_system
        unit: ""
        # [OPCIONAL] — texto (lista cerrada). Storage type of the dimension's column or coordinate in the data, distinct from type, which is its role. A temporal dimension's values stay ISO 8601 strings here even when the source stores years as integers
        data_type: null
        # [OPCIONAL] — lista de objeto. The axis values with labels, in place of values. Not allowed on a type: temporal dimension
        categories:
          -
            # [OPCIONAL] · obligatorio en su objeto — texto o entero. The coded value as stored in the data
            value: ""
            # [OPCIONAL] · obligatorio en su objeto — texto. Short human-readable name of the category
            label: ""
            # [OPCIONAL] — texto. What this category means
            description: ""
    # [OPCIONAL] — lista de objeto. The variables in this structure
    variables:
      -
        # [OPCIONAL] · obligatorio en su objeto — texto
        name: "class"
        # [OPCIONAL] — texto. Stable definition and reading guidance for the variable
        description: ""
        # [OPCIONAL] — texto (lista cerrada). Data type of the stored values. Numeric names follow STAC raster:data_type; the rest cover table columns. other is for nested types (list, map, struct)
        data_type: "uint8"
        # [OPCIONAL] — texto. Unit of measurement in UDUNITS-2, as CF requires (mm d-1, degC, kg ha-1). UCUM only for what UDUNITS-2 cannot express, such as {head}/km2 or [pH]; never a UCUM spelling of a UDUNITS-2 unit. Required for measurements; omit for text or code columns
        unit: ""
