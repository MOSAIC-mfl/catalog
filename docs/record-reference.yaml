      # [OPCIONAL] — lista de texto (vocabulario) · vocab/geography.json: 278 códigos (ver hoja Vocabularios). Countries and regions: ISO 3166-1 alpha-3 (PER), UN M49 regions (m49:419) or global (vocab/geography.json)
