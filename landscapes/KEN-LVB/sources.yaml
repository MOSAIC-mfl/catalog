# Sources of the KEN-LVB explorer layers (from its data/meta/layers.json)
# Generated by scripts/migrate_lake_victoria.py from https://github.com/anaguilarar/mosaic-lake-victoria @ 0d22fe2 (read only).
# Schema: schema/landscape/ (python -m mosaic_catalog validate-landscapes).
layers:
- id: basin
  title: Lake Victoria Basin boundary
  group: Base
  source: >-
    ICPAC geoportal (geonode:lv_basin), 2019; lake shoreline from the Copernicus GLO-30 water-body mask
    (2011-2015), class 2 at native ~30 m, islands as holes
  licence: >-
    ICPAC: not specified (confirm before public release); WBM: Copernicus, free with attribution
  caveats: >-
    Lake shoreline from the Copernicus GLO-30 water-body mask (2011-2015); it predates the 2020/2024 high
    stands.
  citation: ICPAC Geoportal; Copernicus DEM GLO-30 (ESA/Airbus)
  record: null
- id: flood_hazard
  title: Flood hazard (observed flood frequency)
  group: Flood hazard
  placeholder: false
  source: Copernicus EMS Global Flood Monitoring (Sentinel-1), 20 m, 2016-2025
  period: 2016-2025
  units: 'band1: years flooded (0-10); band2: % of valid obs; band3: % excluded'
  licence: 'Copernicus EMS: free with attribution'
  citation: >-
    Salamon et al. (2021) IGARSS, doi:10.1109/IGARSS47720.2021.9554214. Contains modified Copernicus EMS
    information (2016-2025). Hazard proxy, not risk.
  caveats: >-
    Flooded vegetation and urban areas under-detected; short floods between overpasses missed; band 3
    shows where SAR cannot map floods.
  record: null
- id: terrain
  title: Terrain (Copernicus GLO-30)
  group: Base
  source: Copernicus DEM GLO-30 (~30 m), basin extent
  period: GLO-30 2021 release
  units: m above sea level
  licence: 'Copernicus DEM: free use with attribution'
  citation: ESA (2021). Copernicus DEM GLO-30. Contains modified Copernicus data.
  caveats: >-
    The DEM export is a union of two rectangles; areas outside it (all outside the basin: north-west of
    31E/1N, the far south-east and south-west corners) and the 600 km display padding hold synthetic filler.
    Elevations are neither shown nor queryable anywhere; the basin itself has full real GLO-30 coverage.
  record: null
- id: precip
  title: Precipitation (CHIRPS v3)
  group: Climate
  source: >-
    CHIRPS v3.0 daily, 0.05 deg. CHIRPS is a pentad product; daily values are pentad totals disaggregated
    with ECMWF ERA5 precipitation (the 'rnl' flavour).
  period: 1981-2025
  units: mm
  licence: CC-BY-4.0
  caveats: >-
    Satellite rainfall over the lake surface is less reliable; basin means use land cells only.
  citation: Funk et al. (2015), Scientific Data 2:150066; CHIRPS v3.0, UCSB Climate Hazards Center
  record: null
- id: temperature
  title: Temperature (CHIRTS-ERA5)
  group: Climate
  source: CHIRTS-ERA5 daily Tmax/Tmin, 0.05 deg; Tmean = (Tmax+Tmin)/2
  period: 1981-2025
  units: degC
  licence: CC-BY-4.0
  citation: Funk et al. (2019), J. Climate 32:5639-5658; CHIRTS-ERA5, UCSB CHC
  record: null
- id: s2_rgb
  title: Satellite imagery (Sentinel-2)
  group: Base
  source: Sentinel-2 L2A median mosaic 2023-2025 (COPERNICUS/S2_SR_HARMONIZED), 30 m
  period: 2023-2025 (median composite)
  units: true colour (fixed stretch 0-3000, gamma 2.2)
  licence: 'Copernicus Sentinel data: free use with attribution'
  citation: Contains modified Copernicus Sentinel-2 data [2023-2025]
  record: null
- id: lake_level
  title: Lake water level (satellite altimetry)
  group: Water
  source: DAHITI (DGFI-TUM), multi-mission altimetry
  period: 1992-10-17 to 2026-09-14
  units: m WSE
  licence: CC BY-NC 4.0 (DAHITI terms of use; non-commercial use only)
  attribution: DAHITI, DGFI-TUM
  citation: >-
    Schwatke, C., Dettmering, D., Bosch, W., Seitz, F. (2015), HESS 19, 4345–4364, doi:10.5194/hess-19-4345-2015
  record: null
- id: spi3
  title: Drought index (SPI-3)
  group: Climate
  source: >-
    SPI-3 computed from CHIRPS v3.0 monthly totals (gamma fit, Thom 1958; zero-rain mixed distribution),
    calibration 1991-2020. Daily CHIRPS = ERA5-disaggregated pentads ('rnl'); monthly totals are unaffected
    by the disaggregation choice.
  period: 1981-03 to 2026-08
  units: SPI (unitless)
  licence: Derived from CHIRPS v3.0 (CC-BY-4.0)
  citation: >-
    McKee, Doesken & Kleist (1993), 8th Conf. Applied Climatology; classes: WMO (2012), SPI User Guide,
    WMO-No. 1090; Funk et al. (2015), Scientific Data 2:150066
  record: null
- id: rivers
  title: Rivers (HydroRIVERS)
  group: Base
  source: HydroRIVERS v1.0 (HydroSHEDS), Strahler order >= 4, clipped to the basin
  period: static (derived from ~2000 SRTM)
  units: stream order; mean discharge m3/s
  licence: >-
    HydroSHEDS v1 licence (WWF; HydroSHEDS Technical Documentation v1.4, Appendix A). Incorporates data
    from the HydroSHEDS version 1 database, © World Wildlife Fund, Inc. (2006-2022), used under license;
    full attribution in the data README
  citation: >-
    Lehner, B. & Grill, G. (2013). Hydrological Processes 27(15):2171-2186; Lehner, B., Verdin, K., Jarvis,
    A. (2008): New global hydrography derived from spaceborne elevation data. Eos, Transactions, AGU,
    89(10): 93-94. www.hydrosheds.org
  caveats: >-
    The Yala main stem (Strahler >= 4) ends at the Yala Swamp, about 6 km from open water; only lower-order
    swamp channels reach the lake (HydroRIVERS v1.0).
  attribution: >-
    HydroSHEDS-derived layers (rivers, sub-catchments) are included for display in this app only and may
    not be redistributed separately. © World Wildlife Fund, Inc. (2006-2022), used under licence. This
    product MOSAIC Lake Victoria Basin Explorer incorporates data from the HydroSHEDS version 1 database
    which is © World Wildlife Fund, Inc. (2006-2022) and has been used herein under license. WWF has not
    evaluated the data as altered and incorporated within MOSAIC Lake Victoria Basin Explorer, and therefore
    gives no warranty regarding its accuracy, completeness, currency or suitability for any particular
    purpose. Portions of the HydroSHEDS v1 database incorporate data which are the intellectual property
    rights of © USGS (2006-2008), NASA (2000-2005), ESRI (1992-1998), CIAT (2004-2006), UNEP-WCMC (1993),
    WWF (2004), Commonwealth of Australia (2007), and Her Royal Majesty and the British Crown and are
    used under license. The HydroSHEDS v1 database and more information are available at https://www.hydrosheds.org.
  record: null
- id: population
  title: Population (exposure input)
  group: Exposure
  source: WorldPop constrained individual countries 2020, 100 m (KEN, UGA, TZA, RWA, BDI)
  release_note: >-
    2020 constrained (Global 2000-2020, BSGM/maxar): no newer constrained release was found on hub.worldpop.org
    at build time
  period: '2020'
  units: persons per ~100 m grid cell
  licence: CC-BY-4.0
  caveats: Exposure input (people in place), not risk; census-era modelled counts.
  citation: >-
    WorldPop (2020), School of Geography and Environmental Science, University of Southampton. doi:10.5258/SOTON/WP00682
  record: null
- id: forest_loss
  title: Tree-cover loss (Hansen GFC)
  group: Land
  source: Hansen Global Forest Change GFC-2025-v1.13; loss where tree cover 2000 >= 30 %
  period: 2001-2025
  units: loss year; cover %
  licence: CC-BY-4.0
  caveats: >-
    Tree-cover loss, not deforestation; only where cover 2000 >= 30 %; detection improved ~2011-2013,
    annual values not strictly comparable across the break. Map shows cumulative loss at 5-year epochs
    (MapLibre cannot style rasters by value); the panel reports exact annual areas.
  citation: 'Hansen et al. (2013), Science 342:850-853. Data: UMD/Google/USGS/NASA.'
  record: null
- id: fire
  title: Active fires (VIIRS)
  group: Fire
  source: >-
    NASA FIRMS VIIRS 375 m active fires; density: S-NPP only (2012-2025); points: S-NPP + NOAA-20 (NOAA-20
    archive from 2020); confidence nominal/high
  period: 2012-2025
  units: fires per km2 per year
  licence: NASA open data (attribution)
  caveats: >-
    Mostly savanna and crop-residue burning; charcoal production not detected reliably; cloud hides wet-season
    fires. NOAA-20 only in the point layer.
  citation: NASA FIRMS; Schroeder et al. (2014), RSE 143:85-96. doi:10.5067/FIRMS/VIIRS/VNP14IMGT
  record: null
- id: burned_area
  title: Burned area (MODIS)
  group: Fire
  source: >-
    MODIS MCD64A1 v6.1 monthly burned area, annual union per ~500 m cell, via Microsoft Planetary Computer
  period: 2001-2025
  units: burned at least once in the year (0/1)
  licence: NASA open data (attribution)
  caveats: ~500 m detection misses small/low-intensity burns; cloud limits wet-season detection.
  citation: Giglio et al. (2018), RSE 217:72-85. doi:10.5067/MODIS/MCD64A1.061
  range_note: >-
    annual burned area in the basin, all years 2001-2025: min 4100 km2 (2017), median 10296 km2, max 15323
    km2 (2003)
  record: null
- id: landcover
  title: Land cover (Esri/IO annual)
  group: Land
  source: >-
    Esri/Impact Observatory annual LULC v2 (10 m; displayed at 30 m, nearest), via Microsoft Planetary
    Computer (io-lulc-annual-v02)
  period: 2017-2023 (no 2024 release on Planetary Computer at build time, probed 2026-10-21)
  units: land-cover class
  licence: CC BY 4.0
  caveats: >-
    Global land-cover products disagree on cropland in sub-Saharan Africa (Kerner et al. 2023); year-to-year
    change is indicative.
  citation: Karra et al. (2021), IGARSS; Impact Observatory, Esri, Microsoft.
  record: null
- id: worldcover
  title: Land cover reference (ESA WorldCover 2021)
  group: Land
  source: ESA WorldCover 10 m 2021 v200 (displayed at 30 m, nearest)
  period: '2021'
  units: land-cover class
  licence: CC BY 4.0
  citation: Zanaga et al. (2022). ESA WorldCover 10 m 2021 v200. doi:10.5281/zenodo.7254221
  record: null
- id: osm_labels
  title: Place names
  group: Base
  source: >-
    OpenStreetMap via the Protomaps daily basemap (build 2026-10-22, schema v4, Planetiler 0.10.2)
  period: OSM data as of 2026-10-22
  units: 'labels only: countries, cities, towns, villages (from z11), lakes, rivers, protected areas'
  licence: ODbL 1.0 - © OpenStreetMap contributors
  citation: >-
    © OpenStreetMap contributors (openstreetmap.org/copyright). Basemap tiles: Protomaps (protomaps.com).
    Fonts: Noto Sans (SIL Open Font License) via protomaps/basemaps-assets.
  caveats: >-
    Volunteered geographic information: coverage and spelling vary; label positions are OSM points, not
    authoritative gazetteer locations.
  record: null
- id: admin_boundaries
  title: Admin boundaries
  group: Base
  source: >-
    geoBoundaries gbOpen ADM1 + ADM2 (simplified), Kenya, Uganda, Tanzania, Rwanda, Burundi; clipped to
    the basin
  period: boundary years vary by country (2006-2021; see provenance)
  units: ADM1 and ADM2 polygons; names at mid zoom
  licence: >-
    per boundary - see provenance (Public Domain, CC0, CC BY 4.0, CC BY 3.0 IGO, ODbL); geoBoundaries
    itself CC BY 4.0
  citation: >-
    Runfola, D. et al. (2020) geoBoundaries: A global database of political administrative boundaries.
    PLoS ONE 15(4): e0231866. doi:10.1371/journal.pone.0231866
  caveats: >-
    Boundaries are indicative and not an official delimitation. Uganda ADM1 is the 4 regions (2017, from
    OSM) and ADM2 the 2006 counties; Tanzania ADM1 is OSM-derived. Not GADM.
  provenance:
  - country: Kenya
    level: ADM1
    type: Counties
    year: '2020'
