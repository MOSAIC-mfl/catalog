# Map explorer of the KEN-LVB profile
# Generated by scripts/migrate_lake_victoria.py from https://github.com/anaguilarar/mosaic-lake-victoria @ 0d22fe2 (read only).
# Schema: schema/landscape/ (python -m mosaic_catalog validate-landscapes).
title: Lake Victoria Basin Explorer
tagline: Terrain, flood hazard, rainfall, drought, population and tree-cover change · 1981–2026
data:
  roots:
    site: https://anaguilarar.github.io/mosaic-lake-victoria/data/
    hf: https://huggingface.co/datasets/aaguilar90/mosaic-lake-victoria/resolve/main/
  default_root: hf
  routes:
  - prefix: meta/
    root: site
  - prefix: series/
    root: site
  - prefix: vectors/
    root: site
  - prefix: figures/
    root: site
  - prefix: fonts/
    root: site
  - prefix: climate/
    root: site
  - prefix: fire/
    root: site
  - path: query/flood_query_100m.tif
    root: site
  - path: tiles/s2_rgb.pmtiles
    root: site
  - path: tiles/osm_basemap.pmtiles
    root: site
  - path: tiles/terrain.pmtiles
    root: site
  withheld:
  - vectors/basin.geojson
  - vectors/basin_mask.geojson
  withheld_reason: 'ICPAC basin boundary: licence not specified, never published'
  tiles_version: '13'
  report: https://github.com/anaguilarar/mosaic-lake-victoria/blob/main/DATA_REPORT.md
map:
  center:
  - 32.6
  - -1.15
  zoom: 6.65
  pitch: 38
  bearing: -8
  min_zoom: 6.15
  max_zoom: 13
  max_pitch: 62
  max_bounds:
  - - 28.6
    - -4.75
  - - 36.5
    - 2.0
  sky:
    sky-color: '#c8d4de'
    horizon-color: '#e7ebef'
    fog-color: '#e7ebef'
    sky-horizon-blend: 0.6
    horizon-fog-blend: 0.7
  glyphs: fonts/{fontstack}/{range}.pbf
  terrain:
    source: dem
    exaggeration: 1.8
    min: 1
    max: 4
    step: 0.1
  attribution: Copernicus GLO-30 · Sentinel-2
  sources:
    basin:
      type: geojson
      data:
        asset: vectors/basin.geojson
    mask:
      type: geojson
      data:
        asset: vectors/basin_mask.geojson
    lake:
      type: geojson
      data:
        asset: vectors/lake.geojson
    lakeDetail:
      type: geojson
      data:
        asset: vectors/lake_detailed.geojson
    s2:
      type: raster
      url:
        pmtiles: tiles/s2_rgb.pmtiles
      tileSize: 256
    dem:
      type: raster-dem
      url:
        pmtiles: tiles/terrain.pmtiles
      tileSize: 256
      encoding: mapbox
    rivers:
      type: geojson
      data:
        asset: vectors/rivers.geojson
    adm1:
      type: geojson
      data:
        asset: vectors/adm1.geojson
    adm2:
      type: geojson
      data:
        asset: vectors/adm2.geojson
    admLabels:
      type: geojson
      data:
        asset: vectors/admin_labels.geojson
    osm:
      type: vector
      url:
        pmtiles: tiles/osm_basemap.pmtiles
      attribution: © OpenStreetMap contributors
  layers:
  - id: bg
    type: background
    paint:
      background-color: '#dfe5ea'
  - id: s2
    type: raster
    source: s2
    paint:
      raster-resampling: linear
  - id: hillshade
    type: hillshade
    source: dem
    paint:
      hillshade-exaggeration: 0.35
      hillshade-shadow-color: '#3c4148'
      hillshade-highlight-color: '#ffffff'
      hillshade-accent-color: '#5b6672'
  - id: lake-fill
    type: fill
    source: lakeDetail
    paint:
      fill-color: '#2e4b59'
      fill-opacity: 1
  - id: dim
    type: fill
    source: mask
    paint:
      fill-color: '#1c232b'
      fill-opacity: 0.28
  - id: rivers
    type: line
    source: rivers
    layout:
      visibility: visible
      line-cap: round
      line-join: round
    paint:
      line-color: '#117A8D'
      line-opacity: 0.65
      line-width:
      - interpolate
      - - linear
      - - get
        - order
      - 4
      - 0.5
      - 6
      - 1.3
      - 8
      - 2.4
  - id: basin-line
    type: line
    source: basin
    paint:
      line-color: '#0a0a0a'
      line-width: 1.4
  - id: lake-hit
    type: fill
    source: lake
    paint:
      fill-opacity: 0
  - id: labels-start
    type: background
    paint:
      background-opacity: 0
  - id: adm2-hit
    type: fill
    source: adm2
    minzoom: 8
    layout: &id001
      visibility: none
    paint:
      fill-opacity: 0
  - id: adm1-hit
    type: fill
    source: adm1
    layout: *id001
    paint:
      fill-opacity: 0
  - id: adm2-line
    type: line
    source: adm2
    minzoom: 8
    layout: *id001
    paint:
      line-color: '#c9ced2'
      line-width: 0.6
      line-dasharray:
      - 3
      - 2
      line-opacity: 0.8
  - id: adm1-line
    type: line
    source: adm1
    layout: *id001
    paint:
      line-color: '#dfe3e6'
      line-width:
      - interpolate
      - - linear
      - - zoom
      - 6
      - 0.7
      - 11
      - 1.4
      line-opacity: 0.9
  - id: adm1-label
    type: symbol
    source: admLabels
    minzoom: 7
    maxzoom: 11
    filter:
    - ==
    - - get
      - level
    - ADM1
    layout:
      visibility: none
      text-field:
      - get
      - name
      text-font:
      - Noto Sans Regular
      text-size: 11
      text-letter-spacing: 0.06
      text-transform: uppercase
      text-padding: 4
    paint:
      text-color: '#e4e8eb'
      text-halo-color: rgba(17,26,34,0.88)
      text-halo-width: 1.3
  - id: adm2-label
    type: symbol
    source: admLabels
    minzoom: 9.5
    filter:
    - ==
    - - get
      - level
    - ADM2
    layout:
      visibility: none
      text-field:
      - get
      - name
      text-font:
      - Noto Sans Italic
      text-size: 11
      text-padding: 4
    paint:
      text-color: '#e4e8eb'
      text-halo-color: rgba(17,26,34,0.88)
      text-halo-width: 1.3
  - id: osm-natural
    type: symbol
    source: osm
    source-layer: pois
    minzoom: 8
    filter:
    - all
    - - has
      - name
    - - in
      - - get
        - kind
      - - literal
        - - national_park
          - nature_reserve
          - protected_area
          - forest
    layout:
      text-field:
      - get
      - name
      text-font:
      - Noto Sans Italic
      text-size: 11
      text-padding: 3
      text-max-width: 8
    paint:
      text-color: '#e6f0dc'
      text-halo-color: rgba(17,26,34,0.88)
      text-halo-width: 1.5
  - id: osm-water-river
    type: symbol
    source: osm
    source-layer: water
    minzoom: 9
    filter:
    - all
    - - has
      - name
    - - in
      - - get
        - kind
      - - literal
        - - river
          - canal
          - stream
    layout:
      text-field:
      - get
      - name
      text-font:
      - Noto Sans Italic
      text-size: 11
      text-padding: 3
      text-max-width: 8
      symbol-placement: line
      symbol-spacing: 400
    paint:
      text-color: '#d6eef2'
      text-halo-color: rgba(17,26,34,0.88)
      text-halo-width: 1.5
  - id: osm-water
    type: symbol
    source: osm
    source-layer: water
    filter:
    - all
    - - has
      - name
    - - ==
      - - geometry-type
      - Point
    - - in
      - - get
        - kind
      - - literal
        - - lake
          - water
          - bay
          - reservoir
    layout:
      text-field:
      - get
      - name
      text-font:
      - Noto Sans Italic
      text-size:
      - interpolate
      - - linear
      - - zoom
      - 6
      - 12
      - 10
      - 14
      text-padding: 3
      text-max-width: 8
    paint:
      text-color: '#d6eef2'
      text-halo-color: rgba(17,26,34,0.88)
      text-halo-width: 1.5
  - id: osm-village
    type: symbol
    source: osm
    source-layer: places
    minzoom: 11
    filter:
    - all
    - - has
      - name
    - - ==
      - - get
        - kind
      - locality
    - - in
      - - get
        - kind_detail
      - - literal
        - - village
          - hamlet
    layout:
      text-field:
      - get
      - name
      text-font:
      - Noto Sans Regular
      text-size: 11
      text-padding: 3
      text-max-width: 8
      symbol-sort-key: &id002
      - '-'
      - 0
      - - coalesce
        - - get
          - population_rank
        - 0
    paint: &id003
      text-color: '#ffffff'
      text-halo-color: rgba(17,26,34,0.88)
      text-halo-width: 1.5
  - id: osm-town
    type: symbol
    source: osm
    source-layer: places
    minzoom: 7
    filter:
    - all
    - - has
      - name
    - - ==
      - - get
        - kind
      - locality
    - - ==
      - - get
        - kind_detail
      - town
    layout:
      text-field:
      - get
      - name
      text-font:
      - Noto Sans Medium
      text-size:
      - interpolate
      - - linear
      - - zoom
      - 7
      - 11
      - 12
      - 13
      text-padding: 3
      text-max-width: 8
      symbol-sort-key: *id002
    paint: *id003
  - id: osm-city
    type: symbol
    source: osm
    source-layer: places
    filter:
    - all
    - - has
      - name
    - - ==
      - - get
        - kind
      - locality
    - - ==
      - - get
        - kind_detail
      - city
    layout:
      text-field:
      - get
      - name
      text-font:
      - Noto Sans Medium
      text-size:
      - interpolate
      - - linear
      - - zoom
      - 6
      - 12
      - 12
      - 15
      text-padding: 3
      text-max-width: 8
      symbol-sort-key: *id002
    paint: *id003
  - id: osm-country
    type: symbol
    source: osm
    source-layer: places
    maxzoom: 8
    filter:
    - all
    - - has
      - name
    - - ==
      - - get
        - kind
      - country
    layout:
      text-field:
      - get
      - name
      text-font:
      - Noto Sans Medium
      text-size: 13
      text-padding: 3
      text-max-width: 8
      text-transform: uppercase
      text-letter-spacing: 0.12
    paint:
      text-color: '#f3f5f6'
      text-halo-color: rgba(17,26,34,0.88)
      text-halo-width: 1.5
groups:
- Base
- Water
- Flood hazard
- Climate
- Exposure
- Land
- Fire
toggles:
- id: place_names
  group: Base
  title: Place names
  swatch: '#ffffff'
  default: true
  layers:
  - osm-natural
  - osm-water-river
  - osm-water
  - osm-village
  - osm-town
  - osm-city
  - osm-country
  attribution: © OpenStreetMap contributors
  source_ref: osm_labels
- id: admin
  group: Base
  title: Admin boundaries
  swatch: '#c9ced2'
  default: false
  layers:
  - adm2-line
  - adm1-line
  - adm2-hit
  - adm1-hit
  - adm2-label
  - adm1-label
  attribution: geoBoundaries (Runfola et al. 2020)
  source_ref: admin_boundaries
- id: rivers
  group: Water
  title: Rivers
  swatch: '#117A8D'
  default: true
  layers:
  - rivers
  source_ref: rivers
panels:
- id: lake
  group: Water
  title: Lake level
  swatch: '#117A8D'
  kind: series-summary
  source_ref: lake_level
  open_on_click: lake-hit
  heading: Lake Victoria
  subheading: Satellite altimetry · DAHITI (DGFI-TUM)
  series: series/lake_level.json
  points: data
  date: date
  value: wse
  unit: m
  decimals: 2
  summary:
  - stat: latest
    label: Latest level · {date}
  - stat: vs_median
    label: vs median
  - stat: max
    label: Record · {month}
  chart:
    title: Water surface elevation, monthly mean (m)
    height: 190
    decimals: 1
    annotate_max: Record {value} m
    annotate_max_short: record
    reference: median
  note: >-
    {n} altimetry passes, {first} → {last} · {source} · fetched {fetched}. WSE is geoid-referenced altimetry
    of today’s lake; it is not comparable with the GLO-30 terrain, whose surface dates from 2011–2015.
  empty: Lake-level series not available in this version.
click:
  title: Terrain
  source: Copernicus GLO-30
  admin:
    layers:
    - adm2-hit
    - adm1-hit
    visible_layer: adm1-hit
    units:
      KEN:
      - County
      - Sub-county
      UGA:
      - Region
      - County
      TZA:
      - Region
      - District
      RWA:
      - Province
      - District
      BDI:
      - Province
      - Commune
overlays:
- id: flood_years
  group: Flood hazard
  title: Years flooded
  kind: raster-tiles
  source_ref: flood_hazard
  asset: tiles/flood_years.pmtiles
  before: rivers
  paint: &id004
    raster-resampling: nearest
    raster-opacity: 0.85
  attribution: Copernicus EMS GFM
  inspect: &id005
    kind: flood-query
    asset: query/flood_query_100m.tif
    crs: EPSG:32736
    source: Copernicus EMS GFM · 2016–2025
  legend:
    kind: steps
    title: Calendar years with ≥1 flood detection, 2016–2025
    colors:
    - '#45347f'
    - '#3b508a'
    - '#30688d'
    - '#267f8e'
    - '#1e978a'
    - '#27ad80'
    - '#4bc26c'
    - '#81d34c'
    - '#bfdf24'
    - '#fde724'
    labels:
    - '1'
    - '10'
    notes:
    - >-
      a pixel is coloured if any part of it flooded (highest years shown) · 0 years = transparent · where
      GFM excludes ≥50 % of observations, absence of floods is uncertain (see ‘Not assessed’)
    source: Copernicus EMS GFM · 2016–2025
- id: flood_freq
  group: Flood hazard
  title: Flood frequency
  kind: raster-tiles
  source_ref: flood_hazard
  before: rivers
  paint: *id004
  attribution: Copernicus EMS GFM
  inspect: *id005
  variants:
  - id: all
    label: All
    asset: tiles/flood_freq.pmtiles
    legend:
      kind: steps
      title: Flood detections, % of valid observations
      colors: &id006
      - '#45347f'
      - '#355c8c'
      - '#267f8e'
      - '#1fa286'
      - '#4bc26c'
      - '#9fd938'
      - '#fde724'
      labels:
      - ≤1 %
      - 100 %
      notes:
      - zoomed out, a pixel shows the highest frequency within it
      source: Copernicus EMS GFM · 2016–2025
  - id: mam
    label: MAM
    asset: tiles/flood_freq_mam.pmtiles
    legend:
      kind: steps
      title: Flood detections, % of valid March–May observations
      colors: *id006
      labels:
      - ≤1 %
      - 100 %
      notes:
      - >-
        zoomed out, a pixel shows the highest frequency within it · needs ≥20 valid observations in the
        season · values on click are for the whole year
      source: Copernicus EMS GFM · 2016–2025
  - id: ond
    label: OND
    asset: tiles/flood_freq_ond.pmtiles
    legend:
      kind: steps
      title: Flood detections, % of valid October–December observations
      colors: *id006
      labels:
      - ≤1 %
      - 100 %
      notes:
      - >-
        zoomed out, a pixel shows the highest frequency within it · needs ≥20 valid observations in the
        season · values on click are for the whole year
      source: Copernicus EMS GFM · 2016–2025
- id: flood_excl
  group: Flood hazard
  title: Not assessed (GFM exclusion)
  kind: raster-tiles
  source_ref: flood_hazard
  asset: tiles/flood_excl.pmtiles
  before: rivers
  paint: *id004
  attribution: Copernicus EMS GFM
  inspect: *id005
  legend:
    kind: steps
    title: Observations excluded by GFM, %
    colors:
    - '#787878'
    - '#4b4b4b'
    - '#1e1e1e'
    labels:
    - 50 %
    - 100 %
    notes:
    - >-
      Flood layers carry no data here · also covers the Serengeti–Mara zone of radar look-alikes (not
      assessed, see the data report)
    source: Copernicus EMS GFM · 2016–2025
- id: max_2020
  group: Flood hazard
  title: Max extent 2020
  kind: raster-tiles
  source_ref: flood_hazard
  asset: tiles/max_2020.pmtiles
  before: rivers
  paint: *id004
  attribution: Copernicus EMS GFM
  inspect: *id005
  legend:
    kind: steps
    title: Observed water outside the 2011–2015 lake (GLO-30 WBM), Apr–Jul 2020
    colors:
    - '#1f5fbf'
    labels:
    - water observed at least once
    - ''
    notes:
    - >-
      a pixel is coloured if any part of it flooded · Pietroiusti et al. (2024) map additional flooding
      east of the Speke Gulf head; neither GFM’s algorithms nor JRC Global Surface Water (May–June 2020)
      confirm it; April 2020 could not be checked optically because of cloud, and part of the area is
      outside GFM’s mappable zone.
    source: Copernicus EMS GFM · 2016–2025
- id: precip
  group: Climate
  title: Precipitation
  kind: climate-grid
  swatch: '#434e6b'
  source_ref: precip
  grid: climate/app/
  before: dim
  attribution: CHIRPS v3 (UCSB CHC)
  variables:
  - id: precip
    label: Precip
    title: Precipitation
    cells: precip_cells.bin
  aggregate: total
  units: mm
  source: CHIRPS v3.0
  ramp:
  - '#fde737'
  - '#dec957'
  - '#bbad6c'
  - '#9b9376'
  - '#7c7b78'
  - '#61646f'
  - '#434e6b'
  - '#1a386f'
  - '#00224d'
  anomaly:
    kind: ratio
    units: '% of normal'
    centre: 100
    ramp: &id007
    - '#543005'
    - '#8a5009'
    - '#bf812d'
    - '#dec07b'
    - '#f6e8c3'
    - '#f4f4f4'
    - '#c7eae5'
    - '#7ecbc0'
    - '#35978f'
    - '#00655d'
    - '#003c30'
    normals: precip
  water_note: satellite rainfall over the lake is less reliable
  water_cell_note: 'Lake-surface cell: satellite rainfall estimates over open water are less reliable.'
- id: temperature
  group: Climate
  title: Temperature
  kind: climate-grid
  swatch: '#e14c66'
  source_ref: temperature
  grid: climate/app/
  before: dim
  attribution: CHIRTS-ERA5 (UCSB CHC)
  variables:
  - id: tmean
    label: Tmean
    title: Tmean (Tmax+Tmin)/2
    cells: tmean_cells.bin
    normals: tmean
  - id: tmax
    label: Tmax
    title: Tmax
    cells: tmean_cells.bin
    series_of: tmean
  - id: tmin
    label: Tmin
    title: Tmin
    cells: tmean_cells.bin
    series_of: tmean
  aggregate: mean
  units: °C
  source: CHIRTS-ERA5
  ramp:
  - '#060519'
  - '#2a115c'
  - '#5a157e'
  - '#872781'
  - '#b53679'
  - '#e14c66'
  - '#f97b5d'
  - '#feb179'
  - '#fce6a8'
  anomaly:
    kind: difference
    units: °C vs normal
    centre: 0
    ramp:
    - '#053061'
    - '#2064aa'
    - '#4393c3'
    - '#90c4dd'
    - '#d1e5f0'
    - '#f7f6f6'
    - '#fddbc7'
    - '#f3a380'
    - '#d6604d'
    - '#b0172a'
    - '#67001f'
- id: spi3
  group: Climate
  title: Drought (SPI-3)
  kind: index-grid
  swatch: '#35978f'
  source_ref: spi3
  grid: climate/app/
  before: dim
  attribution: SPI-3 from CHIRPS v3
  stack: spi3.tif
  cells: spi3_cells.bin
  qc: spi3_qc.tif
  scale: 0.01
  range:
  - -3
  - 3
  ramp: *id007
  provisional_months: 3
  basin_series: series/spi3_basin.json
  title_long: SPI-3 — 3-month standardized precipitation
  short: SPI-3
  calibration: 1991–2020
  provisional_note: '{from} to {to}: provisional (latest CHIRPS months, may be revised)'
  provisional_cell_note: The latest 2–3 CHIRPS months may be revised.
  axis:
  - −3 dry
  - +3 wet
  classes:
  - max: -2
    label: extremely dry
  - max: -1.5
    label: severely dry
  - max: -1
    label: moderately dry
  - below: 1
    label: near normal
  - below: 1.5
    label: moderately wet
  - below: 2
    label: very wet
  - label: extremely wet
  legend_notes:
  - >-
    ≤ −2.0 extremely dry · −1.5 to −1.99 severely dry · −1.0 to −1.49 moderately dry · −0.99 to 0.99 near
    normal (WMO 2012)
  source: Gamma fit (Thom), calibration 1991–2020 · CHIRPS v3.0 · 0.05°
  cell_source: SPI-3 from CHIRPS v3.0 · calibration 1991–2020
  cell_method: SPI-3 from CHIRPS v3.0 · gamma fit (Thom 1958), zero-rain mixed distribution
- id: population
  group: Exposure
  title: Population
  kind: raster-tiles
  swatch: '#d7301f'
  source_ref: population
  asset: tiles/population.pmtiles
  before: rivers
  paint: *id004
  attribution: WorldPop 2020 (CC-BY)
  legend:
    kind: steps
    title: Population — persons per ~100 m cell (log scale)
    colors:
    - '#fff3e5'
    - '#fdd49e'
    - '#fdbb84'
    - '#fc8d59'
    - '#ef6548'
    - '#d7301f'
    - '#b30000'
    - '#7f0000'
    labels:
    - '1'
    - ≥3000
    source: >-
      WorldPop constrained individual countries 2020, 100 m (KEN, UGA, TZA, RWA, BDI) · exposure input,
      not risk
  inspect:
    kind: cell-sum
    asset: query/pop_100m.tif
    title: Population (exposure input)
    cell_label: This ~100 m cell
    block_label: 3×3 cells (~300 m)
    nodata_text: no data / uninhabited
    note: WorldPop 2020 constrained · modelled counts · people in place, not risk
- id: forest_loss
  group: Land
  title: Tree-cover loss
  kind: year-tiles
  swatch: '#b2182b'
  source_ref: forest_loss
