# Sources of the PER-PCL explorer layers (from its data/meta/layers.json)
# Generated by scripts/migrate_ucayali.py from https://github.com/anaguilarar/mosaic-ucayali @ 24fbe3a (read only).
# Schema: schema/landscape/ (python -m mosaic_catalog validate-landscapes).
layers:
- id: veg_classes
  title: Vegetation classes (co-produced)
  group: Vegetation
  source: >-
    Cooley et al. (2021) vegetation typology dataset v4 (Feb 2022), CaltechDATA; classes co-produced with
    local experts in Ucayali
  period: digitised on 2020/2021 imagery
  licence: CC0 (as stated on the CaltechDATA record)
  citation: >-
    Cooley, S., Pinto, N., Aguilar-Amuchastegui, N., Vela Alvarado, J. & Fahlen, J. (2021). Vegetation
    typology classification and data set in Ucayali, Peru (v4.0). CaltechDATA. doi:10.22002/D1.2318. Described
    in Cooley et al. (2024), Ecology and Evolution 14:e70116, doi:10.1002/ece3.70116
  caveats: >-
    Counts and areas are this app's analysis of the CC0 polygon file. The published dataset has no oil-palm
    or cacao polygons; the paper's results for those classes cannot be reproduced from it. The file's
    'Bosque_secudario_o_degradado' spelling is normalised here (original kept in COBERTURA_RAW).
  record: null
- id: terrain
  title: Terrain
  group: Base
  source: >-
    30 m DEM, department extent (inputs/dem_ucayali_basin_extent.tif; provenance to confirm - see the
    data report)
  units: m above sea level
  licence: per DEM source (to confirm)
  caveats: >-
    Terrain beyond the department extent is synthetic padding for display; elevations are neither shown
    nor queryable there.
  record: null
- id: s2_rgb
  title: Satellite imagery (Sentinel-2)
  group: Base
  source: Sentinel-2 L2A mosaic 2025, 30 m (Earth Engine export; script in prep/)
  period: '2025'
  units: true colour (fixed stretch 0-3000, gamma 2.2)
  licence: 'Copernicus Sentinel data: free use with attribution'
  citation: Contains modified Copernicus Sentinel-2 data [2025]
  record: null
- id: department
  title: Ucayali department
  group: Base
  source: INEI department boundary (inputs/ucayali.shp, FUENTE=INEI)
  licence: >-
    Peruvian government boundary data; the same boundaries on datosabiertos.gob.pe (publisher IGN) carry
    the Open Data Commons Attribution License (ODC-By)
  citation: INEI / IGN via the Plataforma Nacional de Datos Abiertos (datosabiertos.gob.pe)
  caveats: Boundaries are referential (1:100,000), not an official delimitation.
  record: null
- id: admin_boundaries
  title: Provinces & districts
  group: Base
  source: >-
    IGN 'Limites Departamentales' dataset (DISTRITOS_LIMITES.zip), datosabiertos.gob.pe; provinces dissolved
    from districts
  period: portal release 2022-03-10, modified 2023-08-01
  licence: Open Data Commons Attribution License (ODC-By), as stated on the dataset page
  citation: Instituto Geográfico Nacional (IGN), Plataforma Nacional de Datos Abiertos
  caveats: Referential boundaries at 1:100,000; simplified ~90 m for display.
  record: null
- id: protected_areas
  title: Protected areas (ANP & ACR)
  group: Conservation
  source: >-
    SERNANP public map service (geoservicios.sernanp.gob.pe, peru_sernanp_0102: ANP definitivas + ACR),
    clipped to Ucayali and simplified ~90 m
  period: fetched 2026-11-04 (creation year per area in the popup)
  licence: >-
    SERNANP viewer terms: information 'de dominio público'; derived maps authorised with SERNANP cited
    as source; no commercialisation; redistribution of the original information not authorised (this file
    is a clipped, simplified derivative; verbatim terms in the data report)
  citation: >-
    SERNANP - Servicio Nacional de Áreas Naturales Protegidas por el Estado (geo.sernanp.gob.pe)
  caveats: >-
    Boundaries simplified for display; legal areas (ha) are the service's anp_suleg/acr_suleg values,
    not recomputed.
  record: null
- id: fire
  title: Active fires (VIIRS)
  group: Fire
  source: NASA FIRMS VIIRS 375 m active fires (S-NPP), yearly Peru archives, bbox clip
  period: 2012-2025
  units: detections per km² per year (~1 km cells)
  licence: NASA FIRMS data are freely available; cite NASA FIRMS
  citation: 'NASA FIRMS: VIIRS 375 m active fire product (VNP14IMGT). firms.modaps.eosdis.nasa.gov'
  caveats: >-
    Detections, not burned area: small/short fires can be missed under cloud; confidence nominal/high
    only.
  record: null
- id: canopy
  title: Canopy height (ETH 2020)
  group: Vegetation
  source: >-
    ETH Global Canopy Height 2020, 10 m (GEDI + Sentinel-2 deep-learning fusion), six 3-degree tiles mosaicked
    and clipped to the department
  period: '2020'
  units: canopy top height, m (RH98-calibrated)
  licence: CC BY 4.0 (ETH Research Collection record)
  citation: >-
    Lang, N., Jetz, W., Schindler, K. & Wegner, J.D. (2023). A high-resolution canopy height model of
    the Earth. Nature Ecology & Evolution 7:1778-1789. doi:10.1038/s41559-023-02206-6. Data: doi:10.3929/ethz-b-000609802
  caveats: >-
    Model estimate, not a measurement: tall-canopy heights saturate and the map carries the model's uncertainty
    (a per-pixel SD layer exists upstream). Display tiles are averaged to ~38 m at z12; clicks read the
    10 m raster.
  record: null
- id: forest_loss
  title: Forest & loss (GEOBOSQUES)
  group: Land
  source: >-
    GEOBOSQUES (MINAM PNCBMCC + SERFOR/MIDAGRI) Bosque Húmedo Amazónico monitoring, 30 m, national rasters
    clipped to the department; downloaded manually (the site blocks scripted access)
  licence: >-
    the product metadata's LICENCIA field is '-' (no licence stated); citation required as given by GEOBOSQUES
  citation: >-
    MINAM (PNCBMCC) y MIDAGRI (SERFOR). 'Mapa del Bosque Húmedo Amazónico Peruano, 2000-2024'. Acceso
    a través de GEOBOSQUES, geobosques.minam.gob.pe
  caveats: >-
    Covers the Bosque Húmedo Amazónico monitoring area only ('No Monitoreado' elsewhere). Loss includes
    natural losses, not only deforestation; river-channel migration losses are excluded (metadata PRECAUCIONES).
    2001-2016 follow the UMD methodology, 2017+ the PNCBMCC methodology. Areas are this app's analysis.
  period: baseline 2000, loss 2001-2024, forest state 2024
  record: null
- id: precip
  title: Precipitation (CHIRPS v3)
  group: Climate
  source: >-
    CHIRPS v3.0 daily (RNL, ERA5-disaggregated), 0.05 deg, via the aaguilar90 Hugging Face zarr mirror
    of UCSB CHC data
  period: 1981-01 to 2026-08
  units: mm
  licence: CC-BY-4.0
  caveats: The latest 2-3 CHIRPS months are provisional and may be revised.
  citation: Funk et al. (2015), Scientific Data 2:150066; CHIRPS v3.0, UCSB Climate Hazards Center
  record: null
- id: temperature
  title: Temperature (CHIRTS-ERA5)
  group: Climate
  source: >-
    CHIRTS-ERA5 daily Tmax/Tmin, 0.05 deg; Tmean = (Tmax+Tmin)/2; via the aaguilar90 Hugging Face zarr
    mirror of UCSB CHC data
  period: 1981-01 to 2026-08
  units: degC
  licence: CC-BY-4.0
  citation: Funk et al. (2019), J. Climate 32:5639-5658; CHIRTS-ERA5, UCSB CHC
  record: null
- id: spi3
  title: Drought index (SPI-3)
  group: Climate
  source: >-
    SPI-3 computed from CHIRPS v3.0 monthly totals (gamma fit, Thom 1958; zero-rain mixed distribution),
    calibration 1991-2020
  period: 1981-03 to 2026-08
  units: SPI (unitless)
  licence: Derived from CHIRPS v3.0 (CC-BY-4.0)
  caveats: The latest 2-3 CHIRPS months are provisional; class names follow WMO (2012).
  citation: >-
    McKee, Doesken & Kleist (1993), 8th Conf. Applied Climatology; classes: WMO (2012), SPI User Guide,
    WMO-No. 1090; Funk et al. (2015), Sci. Data 2:150066
  record: null
- id: gedi
  title: GEDI canopy height (RH95)
  group: Vegetation
  source: >-
    NASA GEDI L2A (GEDI02_A v002), full-power beams; the paper's filters (Cooley et al. 2024, sect. 2.4)
    plus quality_flag = 1 and degrade_flag = 0 (this app's strict set)
  period: '2019-04-20 to 2025-07-09 (no shots April 2023 - April 2024: GEDI hibernation)'
  units: 'RH95: height above the ground at which 95 % of the returned energy is reached, m'
  licence: 'NASA Earth science data: free and open; cite the product DOI'
  citation: >-
    Dubayah, R., Hofton, M., Blair, J., Armston, J., Tang, H. & Luthcke, S. (2021). GEDI L2A Elevation
    and Height Metrics Data Global Footprint Level V002. NASA EOSDIS Land Processes DAAC. doi:10.5067/GEDI/GEDI02_A.002
  caveats: >-
    This app's analysis. Each dot is one 25 m footprint, located to about ±10 m. Zoomed out, a 1 km grid
    shows the mean RH95 of the shots in each cell; at zooms 9-10 the dots are a random sample. RH95 is
    GEDI's own value (no ground-return transformation, unlike the paper's Table 2a).
  record: null
- id: landcover
  title: Land cover (MapBiomas)
  group: Land
  source: MapBiomas Perú Collection 4 (Landsat, 30 m), national rasters clipped to Ucayali
  period: collection spans 1985-2025; the app serves 2000/2005/2010/2015/2020/2024
  licence: >-
    CC BY 4.0 - 'Los datos de MapBiomas son de uso público, abierto y gratuito, sujetos a citación' (site
    footer)
  citation: MapBiomas Perú Collection 4 (peru.mapbiomas.org). Official class palette.
  caveats: >-
    Oil palm is its own class (35, Palma aceitera); cacao and other specific crops have no class and fall
    inside 'Mosaico agropecuario' (21) - relevant when relating classes to Cooley et al. (2024). Class
    areas are this app's analysis.
  record: null
- id: burned_area
  title: Burned area (MapBiomas)
  group: Fire
  source: MapBiomas Perú Fuego Collection 2 annual burned area (GEE export), 30 m, department clip
  period: 2013-2024
  units: burned at least once in the year; zoomed out, share of the pixel's area that burned
  licence: 'CC BY 4.0 (MapBiomas: public, open and free use, subject to citation)'
  citation: MapBiomas Perú - Colección 2 de fuego (peru.mapbiomas.org)
  caveats: >-
    Landsat-based: misses small or low-severity burns. Zoomed out, each pixel shows the share of its area
    that burned; from zoom 12 each 30 m cell is shown as burned or not. Burned km² per year is this app's
    analysis.
  record: null
- id: indigenous_territories
  title: Indigenous territories (not hosted here)
  caveats: >-
    RAISG's Indigenous-territories data is not redistributed in this app: RAISG's use licence requires
    unaltered data and non-profit use, and the layer includes territories of peoples in isolation. View
    it on RAISG's own map: https://www.raisg.org/es/mapas/
  record: null
