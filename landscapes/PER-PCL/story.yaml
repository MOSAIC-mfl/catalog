# Story of the PER-PCL explorer
# Generated by scripts/migrate_ucayali.py from https://github.com/anaguilarar/mosaic-ucayali @ 24fbe3a (read only).
# Schema: schema/landscape/ (python -m mosaic_catalog validate-landscapes).
title: Forest structure from space and local knowledge
map:
  sources:
    storyVeg:
      type: geojson
      data:
        asset: vectors/veg_classes.geojson
  layers:
  - id: story-veg-halo
    type: line
    source: storyVeg
    layout: &id001
      visibility: none
    paint:
      line-color: '#ffffff'
      line-width: 3
      line-opacity: 0.75
  - id: story-veg-line
    type: line
    source: storyVeg
    layout: *id001
    paint:
      line-color:
      - get
      - color
      line-width: 1.4
  - id: story-veg-focus-halo
    type: line
    source: storyVeg
    layout: *id001
    filter:
    - ==
    - - get
      - PLOTID
    - ''
    paint:
      line-color: '#ffffff'
      line-width: 6
  - id: story-veg-focus
    type: line
    source: storyVeg
    layout: *id001
    filter:
    - ==
    - - get
      - PLOTID
    - ''
    paint:
      line-color: '#1c2b3a'
      line-width: 2.6
  highlights:
    outlines:
    - story-veg-halo
    - story-veg-line
  focus:
    layers:
    - story-veg-focus-halo
    - story-veg-focus
    field: PLOTID
note: >-
  Study numbers are as printed in the cited papers (pages in story_chapters.json); “this app's analysis”
  numbers come from the app's own data (methods in the data report).
chapters:
- id: intro
  title: A department the size of a country
  text: >-
    Ucayali stretches from the Andean foothills to the heart of the Peruvian Amazon — about 105,000 km²,
    roughly the size of Iceland. The Ucayali River, a ~2,700 km headwater tributary of the Amazon, runs
    the length of it, and lowland rainforest covers most of the department. On the department's land cells
    the 1991–2020 normal is ≈ 2,150 mm of rain a year; in Coronel Portillo and Padre Abad it is ≈ 2,240
    mm (this app's analysis of CHIRPS v3). Cooley et al. (2024, p.4) give ≈ 1,560 mm for northern Ucayali,
    citing NOAA (2022). Around 496,459 people live here; 12.3 % speak an indigenous language as their
    first language, Shipibo above all.
  visual:
    layers: []
    camera:
      lng: -73.6
      lat: -9.5
      zoom: 6.1
      pitch: 35
  numbers:
  - value: ~2,700 km
    label: length of the Ucayali River, between the high Andes and the low hills to the east
    source:
      kind: study
      citation: Amazon Waters Alliance (2022), as cited in Cooley et al. (2024)
      page: p.4
  - value: 496,459
    label: inhabitants of Ucayali
    source:
      kind: study
      citation: INEI (2022), as cited in Cooley et al. (2024)
      page: p.4
  - value: ≈ 105,000 km²
    label: department area, from the INEI boundary
    source:
      kind: app
      method: equal-area measurement of inputs/ucayali.shp
  - value: ≈ 2,150 mm
    label: >-
      mean annual rainfall 1991–2020 on the department's land cells (≈ 2,240 mm in Coronel Portillo +
      Padre Abad, where the vegetation-class polygons are)
    source:
      kind: app
      method: CHIRPS v3.0 annual totals averaged over 0.05° land cells, 1991–2020
  sources:
  - >-
    Climate (≈1,560 mm yr⁻¹, 26.3 °C, 114 rainy days): NOAA (2022), as cited in Cooley et al. (2024),
    Ecology and Evolution 14:e70116, sect. 2.1, p.4.
  - >-
    River length: Amazon Waters Alliance (2022); population and languages: INEI (2022, 2007) — all as
    cited in Cooley et al. (2024), p.4.
- id: classes
  title: The forest is not one thing
  text: >-
    What a land-cover map calls 'forest' is many things here: old-growth lowland forest, secondary forest
    regrowing after cultivation, young purma on recently rested fields, palm swamps, cloud forest. Cooley
    et al. built their vegetation classes WITH the people who know this landscape — a two-day workshop
    and about two years of roughly bi-monthly dialogues with local experts, then 324 polygons digitised
    on satellite imagery and verified through time. The classes carry local names: purma is under ~8 years
    old, secondary forest ~8–20, mature forest more than 20.
  visual:
    layers:
    - veg_classes
    camera:
      lng: -75.25
      lat: -8.95
      zoom: 10.3
      pitch: 0
    note: >-
      Click any polygon for its class, local name and the imagery it was digitised on. The polygons are
      sampled patches, not a wall-to-wall map.
  numbers:
  - value: '324'
    label: vegetation-class polygons published by the project (CC0), shown on this map
    source:
      kind: app
      method: count of the CaltechDATA v4 polygon file (doi:10.22002/D1.2318)
  - value: < 8 · 8–20 · > 20 years
    label: purma · secondary forest · mature forest, as the local typology defines them
    source:
      kind: study
      citation: Cooley et al. (2024), Table 1
      page: pp.8–10
  sources:
  - >-
    Co-production process (workshop + ~bi-monthly dialogues over 2 years): Cooley et al. (2024), sect.
    2.2, p.5.
  - >-
    Class definitions and names: Table 1, pp.7–10; dataset README (CaltechDATA doi:10.22002/D1.2318, CC0).
  - >-
    Digitisation on Google Earth/Bing (~2015–2019) and MAXAR (2020), verified with monthly Planet imagery:
    sect. 2.3.1, p.6.
- id: forest_loss
  title: Twenty-four years of loss
  text: >-
    Since the 2000 baseline, Ucayali has lost about 6,054 km² of humid Amazon forest — concentrated along
    the roads and rivers of Padre Abad and Coronel Portillo, while Purús, in the remote east, lost almost
    nothing. About 91,159 km² of forest still stood in 2024. The regional government's own strategy flags
    11.35 % of Ucayali's intact forests as at risk (Gobierno Regional de Ucayali 2022, as cited in Cooley
    et al. 2024, p.18).
  visual:
    layers:
    - forest_loss
    camera:
      lng: -75.1
      lat: -8.85
      zoom: 8.6
      pitch: 0
    steps:
    - label: Drought index, Jun–Aug 2024
      layer: spi3
      camera:
        lng: -73.6
        lat: -9.5
        zoom: 6.3
        pitch: 0
      time:
        month: 2024-08
    - label: Active fires, 2024
      layer: fire
      camera:
        lng: -73.6
        lat: -9.5
        zoom: 6.3
        pitch: 0
      time:
        year: 2024
    pending_note: >-
      The year-by-year loss map and annual series arrive when GEOBOSQUES' annual loss raster (with the
      year field) is added to the pipeline.
    charts:
    - builder: class-bars
      title: Department land by GEOBOSQUES class, km²
      series: series/forest_classes.json
      values_path:
      - regions
      - Ucayali
      labels_path:
      - classes
      groups:
        '1':
          label: ''
          colour: '#2e5573'
        '2':
          label: ''
          colour: '#1f6b45'
        '3':
          label: ''
          colour: '#d64530'
        '4':
          label: ''
          colour: '#d8c26a'
      unit: km²
      tip: '{label}: {value} (this app''s analysis)'
      note: This app's analysis of the GEOBOSQUES combined raster; ordered by area.
  numbers:
  - value: 6,054 km²
    label: forest loss 2001–2024 in the department (includes natural losses, not only deforestation)
    source:
      kind: app
      method: GEOBOSQUES combined raster clipped to the department, 30 m pixel counting
  - value: 2,154 vs 30 km²
    label: loss in Padre Abad vs Purús — the whole gradient of the department in two provinces
    source:
      kind: app
      method: GEOBOSQUES raster by province (this app's analysis)
  - value: 11.35 %
    label: >-
      of Ucayali's intact forests (1,059,312 ha) are in at-risk areas, per the regional low-emissions
      strategy
    source:
      kind: study
      citation: Gobierno Regional de Ucayali (2022), as cited in Cooley et al. (2024)
      page: p.18
  - value: 17,468
    label: >-
      VIIRS active-fire detections in the department in 2024 — the highest in the VIIRS record (2012–2025)
    source:
      kind: app
      method: NASA FIRMS VIIRS S-NPP, confidence nominal/high, inside the department boundary
  - value: 786 km²
    label: >-
      MapBiomas burned area (Fuego Collection 2) also peaks in 2024, the largest of 2013–2024, matching
      the VIIRS detections; this app's analysis.
    source:
      kind: app
      method: MapBiomas Perú Fuego Collection 2 annual burned area, 30 m, cells inside the department
  - value: 1,686 mm
    label: >-
      department rainfall in 2024 — the lowest annual total of 1981–2025 (normal 1991–2020 ≈ 2,150 mm)
    source:
      kind: app
      method: CHIRPS v3.0 annual totals, department land cells; rank among 45 complete years
  - value: −1.89
    label: >-
      department-mean SPI-3 for Jun–Aug 2024 (severely dry, WMO 2012) — the 3rd lowest since 1981, after
      2023 (−2.23) and 1988 (−1.91). The data show co-occurrence, not cause.
    source:
      kind: app
      method: SPI-3 from CHIRPS v3.0, window ending August, calibration 1991–2020
  sources:
  - >-
    GEOBOSQUES (MINAM PNCBMCC + SERFOR/MIDAGRI), 'Mapa del Bosque Húmedo Amazónico Peruano 2000–2024';
    loss integrates natural and anthropic losses (product metadata, PRECAUCIONES).
  - >-
    Fire, burned-area and drought numbers: this app's analysis of NASA FIRMS VIIRS (2012–2025), MapBiomas
    Fuego Collection 2 (2013–2024) and CHIRPS v3.0 (1981–2025); they show co-occurrence in 2024, not cause.
  - >-
    At-risk share: Ucayali Regional Strategy for Low Emissions Rural Development, as cited in Cooley et
    al. (2024), p.18.
- id: gedi
  title: A laser from the Space Station
  text: >-
    NASA's GEDI lidar, mounted on the International Space Station, fires laser pulses that return the
    vertical structure of the forest in 25 m footprints — through the haze and between the clouds that
    defeat optical satellites. Cooley et al. kept only the most reliable shots: full-power beams, beam
    sensitivity of at least 0.9, and ground elevations that five of six algorithms agreed on to within
    2 m. Of the 29.1 million full-power shots GEDI recorded over a box around the department from April
    2019 to July 2025, about one in five passes all three tests; the rest fail the sensitivity test or
    the ground-elevation test. The map then keeps only the shots inside the department that also pass
    GEDI's own quality flags: 1.5 million footprints, each a dot coloured by its height.
  visual:
    layers:
    - gedi
    camera:
      lng: -75.2
      lat: -8.9
      zoom: 10.2
      pitch: 0
  numbers:
  - value: 5.25 of 29.1 million
    label: >-
      full-power GEDI shots over a box around the department that pass the paper's three filters, April
      2019 – July 2025
    source:
      kind: app
      method: >-
        GEDI02_A v002 Harmony subsets filtered as in Cooley et al. (2024), sect. 2.4 (pipeline steps 11–12)
  - value: 1.5 million
    label: of them inside the department that also pass GEDI's quality flags — the dots on the map
    source:
      kind: app
      method: 'strict set: plus quality_flag = 1 and degrade_flag = 0 (pipeline step 14)'
  - value: 25 m
    label: diameter of one GEDI footprint on the ground
    source:
      kind: study
      citation: Cooley et al. (2024), Fig. 6
      page: p.15
  - value: ≥ 0.9 · ≤ 2 m
    label: >-
      beam sensitivity threshold · allowed ground-elevation spread among the five best algorithms
    source:
      kind: study
      citation: Cooley et al. (2024), sect. 2.4
      page: pp.11–12
  sources:
  - >-
    GEDI L2A product and filters: Cooley et al. (2024), sect. 2.4, pp.11–12; Dubayah et al. (2020).
  - This app uses GEDI02_A v002 (the paper's data link is v001) — see the data report.
  - >-
    Shot counts and the footprint map: this app's analysis; the GEDI archive has no shots from April 2023
    to April 2024.
- id: heights
  title: How tall is each forest?
  text: >-
    Each dot is one GEDI footprint, coloured by its RH95 — the height below which 95 % of the returned
    laser energy lies: dark green is tall canopy, pale is low. The outlines are the vegetation classes
    mapped with local experts. Step through three of them. In mature lowland forest (more than 20 years
    old) almost every dot is dark; Cooley et al. report a mean RH95 of 29.55 m for this class. In secondary
    forest (about 8–20 years) pale and dark dots sit side by side; its mean is 21.25 m, with the widest
    spread of any class (sd 8.85 m), which the authors attribute to patches at different stages of regrowth.
    In purma, regrowth younger than about 8 years, the dots are pale: 6.33 m on average, close to monocrop
    cacao (6.85 m). Oil palm sits in between at 11.50 m.
  visual:
    layers:
    - gedi
    focus: SC_338
    camera:
      bounds:
      - -75.2313
      - -9.0767
      - -75.1766
      - -9.0051
      pitch: 0
      lng: -75.20395
      lat: -9.0409
    steps:
    - label: 1 · Mature lowland forest
      layer: gedi
      focus: SC_338
      camera:
        bounds:
        - -75.2313
        - -9.0767
        - -75.1766
        - -9.0051
        pitch: 0
        lng: -75.20395
        lat: -9.0409
    - label: 2 · Secondary forest
      layer: gedi
      focus: SC_344
      camera:
        bounds:
        - -74.9404
        - -8.4055
        - -74.9264
        - -8.3941
        pitch: 0
        lng: -74.9334
        lat: -8.3998
    - label: 3 · Purma
      layer: gedi
      focus: SC_356
      camera:
        bounds:
        - -74.8986
        - -8.7188
        - -74.8943
        - -8.7143
        pitch: 0
        lng: -74.89645
        lat: -8.71655
    show:
    - outlines
    charts:
    - builder: class-bars
      title: Canopy height by class — mean RH95 (Table 2a)
      series: series/cooley_tables.json
      rows_path:
      - classes
      label_field: label
      value_field: rh95_mean
      group_field: group
      groups: &id002
        forest:
          label: Forest regeneration classes
          colour: '#2f7d4f'
        agri:
          label: Agricultural classes
          colour: '#c48a2c'
      decimals: 2
      unit: m
      tip: '{label}: {rh95_mean|fixed:2} m (sd {rh95_sd|fixed:2} m; n = {n|int} footprints, Table 2a)'
      note: >-
        The paper's published means (ground returns removed), Table 2a p.16, ordered by value; hover a
        bar for its standard deviation and footprint count.
  numbers:
  - value: 29.55 m
    label: mean canopy height (RH95) of mature lowland forest, n = 2,063 footprints
    source:
      kind: study
      citation: Cooley et al. (2024), Table 2a
      page: p.16
  - value: 21.25 m
    label: mean RH95 of secondary or degraded lowland forest (sd 8.85 m — the most variable class)
    source:
      kind: study
      citation: Cooley et al. (2024), Table 2a
      page: p.16
  sources:
  - >-
    RH95 by class: Table 2a, p.16 (ground returns removed). The abstract quotes the untransformed Table
    2b values (29.40 / 20.82 m), p.1–2 and p.16.
  - >-
    Class ages: Table 1, pp.8–10. Secondary forest's spread and regrowth stages: sect. 4.1, p.17.
  - >-
    Map: GEDI L2A v002 footprints, the paper's filters plus GEDI's quality flags, April 2019 – July 2025
    (chapter 4); polygons SC_338, SC_344 and SC_356 of the CaltechDATA v4 vegetation typologies (CC0).
  - 'How this app''s footprints compare with the paper''s tables: data report, replication check.'
- id: shape
  title: The shape of the canopy
  text: >-
    Height is only half the story; the other half is where the canopy holds its substance. The ratio RH50/RH95
    says how high the median of the returned laser energy sits. The surprise of the paper: secondary forest
    (0.54) looks almost like mature forest (0.58) in vertical profile — the authors expected regrowing
    forest to look clearly different. Oil palm (0.53) mimics a closed forest canopy too, while cacao and
    purma (0.35–0.36) keep their energy low.
  visual:
    layers:
    - canopy
    camera:
      lng: -75.2
      lat: -8.9
      zoom: 10
      pitch: 0
    note: >-
      Caveat: the paper's discussion text (sect. 4.1, p.13) states these two ratios the other way round;
      this app quotes Table 4a and the abstract, and records the discrepancy in the data report.
    charts:
    - builder: class-bars
      title: Canopy shape — mean RH50/RH95 (Table 4a)
      series: series/cooley_tables.json
      rows_path:
      - classes
      label_field: label
      value_field: ratio_mean
      group_field: group
      groups: *id002
      decimals: 2
      max: 1
      tip: '{label}: {ratio_mean|fixed:2} (Table 4a; n = {n|int} footprints, Table 2a)'
      note: >-
        Scale 0–1: closer to 1 = energy returned high in the canopy. The paper's values, Table 4a p.17
        (abstract p.1: 0.58 / 0.54 / 0.53), ordered by value.
  numbers:
  - value: 0.58 vs 0.54
    label: >-
      mean RH50/RH95 of mature vs secondary lowland forest — unexpectedly similar vertical profiles
    source:
      kind: study
      citation: Cooley et al. (2024), Table 4a (abstract p.1)
      page: p.17
  - value: p < .0001
    label: >-
      after accounting for canopy height, mature forest keeps a ~0.03 higher ratio than secondary
    source:
      kind: study
      citation: Cooley et al. (2024), sect. 3.2
      page: p.13
  sources:
  - 'RH50/RH95 by class: Table 4a, p.17; abstract values 0.58 / 0.54 / 0.53, pp.1–2.'
  - >-
    Hypotheses and the surprise: Fig. 1 p.4; sect. 4.1 pp.13, 16–17. Table 4b is not quoted (rows appear
    swapped — data report §2).
- id: footprint
  title: The footprint problem
  text: >-
    A GEDI shot lands within about ±10 m of where it says it lands. To be sure a footprint sampled one
    single class, Cooley et al. required a homogeneous area of ~65 m across (the 25 m footprint plus twice
    the geolocation error) — and at that standard, not a single cacao observation survived: smallholder
    plots are simply too small for the laser's aim. That is why the smallest farms stay invisible to spaceborne
    lidar, and why local knowledge had to carry the map where the instrument could not.
  visual:
    layers:
    - veg_classes
    camera:
      lng: -75.468
      lat: -8.897
      zoom: 12.5
      pitch: 0
    note: >-
      The view shows small purma and secondary-forest polygons near San Alejandro — patches at the scale
      where the 65 m rule bites.
  numbers:
  - value: ~65 m
    label: diameter of the homogeneous area needed per footprint (25 m beam ± 2σ geolocation error)
    source:
      kind: study
      citation: Cooley et al. (2024), Fig. 6
      page: p.15
  - value: '0'
    label: cacao observations remaining after the 65 m homogeneity filter
    source:
      kind: study
      citation: Cooley et al. (2024), sect. 3.1
      page: p.13
  sources:
  - >-
    Geolocation error and the 45 m / 65 m rule: sect. 2.4 p.12 and Fig. 6 p.15; consequences for cacao
    and small high-conservation-value patches: pp.13, 18–19.
- id: limits
  title: What the map cannot see
  text: >-
    Every layer here has edges. The paper left out the wetland forests that stand in water along the Ucayali
    River: where the water level keeps changing, the lidar cannot reliably find the ground. The vegetation-class
    layer includes two such types, palm swamps (aguajales, 3 polygons) and wetland forest (2 polygons),
    but they were not analysed. GEDI's coverage is sparse in parts of the western Amazon. And one absence
    is deliberate: the cacao plots mapped together with women farmers are not in the public dataset, and
    this app does not look for them — the published polygons cover the forest and regrowth classes only,
    so the paper's oil-palm and cacao results cannot be reproduced from public data.
  visual:
    layers: []
    camera:
      lng: -74.3
      lat: -9.1
      zoom: 8.2
      pitch: 30
  numbers:
  - value: '0'
    label: oil-palm or cacao polygons in the published CC0 dataset (by design)
    source:
      kind: app
      method: inventory of the CaltechDATA v4 polygon file
  sources:
  - 'Wetland forests along the Ucayali excluded: Cooley et al. (2024), sect. 2.1, p.4.'
  - >-
    Polygon counts (3 palm-swamp, 2 wetland-forest): this app's analysis, inventory of the CaltechDATA
    v4 polygon file.
  - >-
    Sparse GEDI coverage in the western Amazon: Potapov et al. (2021), as cited in Cooley et al. (2024),
    sect. 4.3, p.19.
  - >-
    Cacao mapped with women farmers of the Alianza Cacao Peru programme: sect. 2.3.3, p.11; the plots
    are not part of the public dataset.
- id: stewards
  title: Who stewards the landscape
  text: >-
    Seven national protected areas and three regional conservation areas reach into Ucayali, from Cordillera
    Azul in the west to Alto Purús in the east. The vegetation typology itself was co-produced by people
    who manage and live from this landscape: Alianza Cacao, CIAT, Conservación Amazónica, the Universidad
    Nacional de Ucayali and the Universidad Nacional Mayor de San Marcos, the regional economic development
    office, SERNANP — and the women cacao farmers of the Alianza Cacao Peru programme, whose field knowledge
    anchored the agricultural classes.
  visual:
    layers:
    - protected_areas
    camera:
      lng: -73.4
      lat: -9.7
      zoom: 6.8
      pitch: 0
    note: >-
      Click an area for its name, category and creation year. Indigenous territories are deliberately
      not hosted in this app (RAISG licence and sensitivity) — see About & sources for the link to RAISG's
      own map.
  numbers:
  - value: 7 + 3
    label: >-
      national protected areas (ANP) and regional conservation areas (ACR) intersecting the department
    source:
      kind: app
      method: SERNANP map service clipped to the department, fetched 2026-11-04
  sources:
  - >-
    Partner institutions as the paper lists them: Cooley et al. (2024), sect. 2.2 p.5 and sect. 2.3.3
    p.11. Funded by the NASA SERVIR programme (acknowledgments, p.19).
  - >-
    Protected areas: SERNANP (geo.sernanp.gob.pe), cited as source; boundaries simplified for display.
- id: explore
  title: Explore the layers yourself
  text: >-
    Switch between the vegetation classes, canopy height, forest & loss, fires and protected areas — every
    layer carries its source, licence and caveats in About & sources, and every number in this story is
    either printed in the cited paper (page recorded) or computed by this app and labelled so.
  visual:
    layers: []
    camera:
      lng: -73.6
      lat: -9.5
      zoom: 6.3
      pitch: 32
    action: explore
  sources:
  - 'Data report: the DATA_REPORT.md link in About & sources.'
