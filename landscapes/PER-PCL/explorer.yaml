# Map explorer of the PER-PCL profile
# Generated by scripts/migrate_ucayali.py from https://github.com/anaguilarar/mosaic-ucayali @ 24fbe3a (read only).
# Schema: schema/landscape/ (python -m mosaic_catalog validate-landscapes).
title: MOSAIC Ucayali Explorer
tagline: >-
  Vegetation classes, lidar canopy height, forest loss, land cover, fire, protected areas and climate
  · 1981–2026
data:
  roots:
    site: https://anaguilarar.github.io/mosaic-ucayali/data/
    hf: https://huggingface.co/datasets/aaguilar90/mosaic-ucayali/resolve/main/
  default_root: hf
  routes:
  - prefix: meta/
    root: site
  - prefix: series/
    root: site
  - prefix: vectors/
    root: site
  - prefix: figures/
    root: site
  - prefix: fonts/
    root: site
  - prefix: climate/
    root: site
  - path: tiles/osm_basemap.pmtiles
    root: site
  - path: tiles/terrain.pmtiles
    root: site
  - path: tiles/s2_rgb.pmtiles
    root: site
  tiles_version: '1'
  report: https://github.com/anaguilarar/mosaic-ucayali/blob/main/DATA_REPORT.md
map:
  center:
  - -73.6
  - -9.5
  zoom: 6.1
  pitch: 32
  bearing: 0
  min_zoom: 5.5
  max_zoom: 16
  max_pitch: 62
  max_bounds:
  - - -79.0
    - -14.3
  - - -67.4
    - -4.4
  sky:
    sky-color: '#c8d4de'
    horizon-color: '#e7ebef'
    fog-color: '#e7ebef'
    sky-horizon-blend: 0.6
    horizon-fog-blend: 0.7
  glyphs: fonts/{fontstack}/{range}.pbf
  terrain:
    source: dem
    exaggeration: 1.6
    min: 1.0
    max: 4.0
    step: 0.1
  attribution: Sentinel-2 · DEM
  sources:
    department:
      type: geojson
      data:
        asset: vectors/department.geojson
    mask:
      type: geojson
      data:
        asset: vectors/department_mask.geojson
    s2:
      type: raster
      url:
        pmtiles: tiles/s2_rgb.pmtiles
      tileSize: 256
    dem:
      type: raster-dem
      url: &id001
        pmtiles: tiles/terrain.pmtiles
      tileSize: 256
      encoding: mapbox
    demHillshade:
      type: raster-dem
      url: *id001
      tileSize: 256
      encoding: mapbox
    provinces:
      type: geojson
      data:
        asset: vectors/provinces.geojson
    districts:
      type: geojson
      data:
        asset: vectors/districts.geojson
    admLabels:
      type: geojson
      data:
        asset: vectors/admin_labels.geojson
    osm:
      type: vector
      url:
        pmtiles: tiles/osm_basemap.pmtiles
      attribution: © OpenStreetMap contributors
  layers:
  - id: bg
    type: background
    paint:
      background-color: '#dfe5ea'
  - id: s2
    type: raster
    source: s2
    paint:
      raster-resampling: linear
  - id: hillshade
    type: hillshade
    source: demHillshade
    paint:
      hillshade-exaggeration: 0.35
      hillshade-shadow-color: '#3c4148'
      hillshade-highlight-color: '#ffffff'
      hillshade-accent-color: '#5b6672'
  - id: dim
    type: fill
    source: mask
    paint:
      fill-color: '#dfe5ea'
      fill-opacity: 1
  - id: department-halo
    type: line
    source: department
    layout:
      line-join: round
    paint:
      line-color: '#ffffff'
      line-opacity: 0.85
      line-width:
      - interpolate
      - - linear
      - - zoom
      - 5
      - 3
      - 8
      - 4.5
      - 12
      - 6
  - id: department-line
    type: line
    source: department
    layout:
      line-join: round
    paint:
      line-color: '#1c2b3a'
      line-width:
      - interpolate
      - - linear
      - - zoom
      - 5
      - 1.4
      - 8
      - 2
      - 12
      - 2.6
  - id: labels-start
    type: background
    paint:
      background-opacity: 0
  - id: districts-hit
    type: fill
    source: districts
    minzoom: 8
    layout: &id002
      visibility: none
    paint:
      fill-opacity: 0
  - id: provinces-hit
    type: fill
    source: provinces
    layout: *id002
    paint:
      fill-opacity: 0
  - id: districts-line
    type: line
    source: districts
    minzoom: 8
    layout: *id002
    paint:
      line-color: '#c9ced2'
      line-width: 0.6
      line-dasharray:
      - 3
      - 2
      line-opacity: 0.8
  - id: provinces-line
    type: line
    source: provinces
    layout: *id002
    paint:
      line-color: '#dfe3e6'
      line-width:
      - interpolate
      - - linear
      - - zoom
      - 6
      - 0.7
      - 11
      - 1.4
      line-opacity: 0.9
  - id: provinces-label
    type: symbol
    source: admLabels
    minzoom: 6.5
    maxzoom: 11
    filter:
    - ==
    - - get
      - level
    - province
    layout:
      visibility: none
      text-field:
      - get
      - name
      text-font:
      - Noto Sans Regular
      text-size: 11
      text-letter-spacing: 0.06
      text-transform: uppercase
      text-padding: 4
    paint:
      text-color: '#e4e8eb'
      text-halo-color: rgba(17,26,34,0.88)
      text-halo-width: 1.3
  - id: districts-label
    type: symbol
    source: admLabels
    minzoom: 9
    filter:
    - ==
    - - get
      - level
    - district
    layout:
      visibility: none
      text-field:
      - get
      - name
      text-font:
      - Noto Sans Italic
      text-size: 11
      text-padding: 4
    paint:
      text-color: '#e4e8eb'
      text-halo-color: rgba(17,26,34,0.88)
      text-halo-width: 1.3
  - id: osm-natural
    type: symbol
    source: osm
    source-layer: pois
    minzoom: 8
    filter:
    - all
    - - has
      - name
    - - in
      - - get
        - kind
      - - literal
        - - national_park
          - nature_reserve
          - protected_area
          - forest
    layout:
      text-field:
      - get
      - name
      text-font:
      - Noto Sans Italic
      text-size: 11
      text-padding: 3
      text-max-width: 8
    paint:
      text-color: '#e6f0dc'
      text-halo-color: rgba(17,26,34,0.88)
      text-halo-width: 1.5
  - id: osm-water-river
    type: symbol
    source: osm
    source-layer: water
    minzoom: 8
    filter:
    - all
    - - has
      - name
    - - in
      - - get
        - kind
      - - literal
        - - river
          - canal
          - stream
    layout:
      text-field:
      - get
      - name
      text-font:
      - Noto Sans Italic
      text-size: 11
      text-padding: 3
      text-max-width: 8
      symbol-placement: line
      symbol-spacing: 400
    paint:
      text-color: '#d6eef2'
      text-halo-color: rgba(17,26,34,0.88)
      text-halo-width: 1.5
  - id: osm-water
    type: symbol
    source: osm
    source-layer: water
    filter:
    - all
    - - has
      - name
    - - ==
      - - geometry-type
      - Point
    - - in
      - - get
        - kind
      - - literal
        - - lake
          - water
          - bay
          - reservoir
    layout:
      text-field:
      - get
      - name
      text-font:
      - Noto Sans Italic
      text-size:
      - interpolate
      - - linear
      - - zoom
      - 6
      - 12
      - 10
      - 14
      text-padding: 3
      text-max-width: 8
    paint:
      text-color: '#d6eef2'
      text-halo-color: rgba(17,26,34,0.88)
      text-halo-width: 1.5
  - id: osm-village
    type: symbol
    source: osm
    source-layer: places
    minzoom: 11
    filter:
    - all
    - - has
      - name
    - - ==
      - - get
        - kind
      - locality
    - - in
      - - get
        - kind_detail
      - - literal
        - - village
          - hamlet
    layout:
      text-field:
      - get
      - name
      text-font:
      - Noto Sans Regular
      text-size: 11
      text-padding: 3
      text-max-width: 8
      symbol-sort-key: &id003
      - '-'
      - 0
      - - coalesce
        - - get
          - population_rank
        - 0
    paint: &id004
      text-color: '#ffffff'
      text-halo-color: rgba(17,26,34,0.88)
      text-halo-width: 1.5
  - id: osm-town
    type: symbol
    source: osm
    source-layer: places
    minzoom: 7
    filter:
    - all
    - - has
      - name
    - - ==
      - - get
        - kind
      - locality
    - - ==
      - - get
        - kind_detail
      - town
    layout:
      text-field:
      - get
      - name
      text-font:
      - Noto Sans Medium
      text-size:
      - interpolate
      - - linear
      - - zoom
      - 7
      - 11
      - 12
      - 13
      text-padding: 3
      text-max-width: 8
      symbol-sort-key: *id003
    paint: *id004
  - id: osm-city
    type: symbol
    source: osm
    source-layer: places
    filter:
    - all
    - - has
      - name
    - - ==
      - - get
        - kind
      - locality
    - - ==
      - - get
        - kind_detail
      - city
    layout:
      text-field:
      - get
      - name
      text-font:
      - Noto Sans Medium
      text-size:
      - interpolate
      - - linear
      - - zoom
      - 6
      - 12
      - 12
      - 15
      text-padding: 3
      text-max-width: 8
      symbol-sort-key: *id003
    paint: *id004
  - id: osm-country
    type: symbol
    source: osm
    source-layer: places
    maxzoom: 7
    filter:
    - all
    - - has
      - name
    - - ==
      - - get
        - kind
      - country
    layout:
      text-field:
      - get
      - name
      text-font:
      - Noto Sans Medium
      text-size: 13
      text-padding: 3
      text-max-width: 8
      text-transform: uppercase
      text-letter-spacing: 0.12
    paint:
      text-color: '#f3f5f6'
      text-halo-color: rgba(17,26,34,0.88)
      text-halo-width: 1.5
groups:
- Base
- Vegetation
- Land
- Climate
- Fire
- Conservation
toggles:
- id: place_names
  group: Base
  title: Place names
  swatch: '#ffffff'
  default: true
  layers:
  - osm-natural
  - osm-water-river
  - osm-water
  - osm-village
  - osm-town
  - osm-city
  - osm-country
  attribution: © OpenStreetMap contributors
- id: admin
  group: Base
  title: Provinces & districts
  swatch: '#c9ced2'
  default: false
  layers:
  - districts-line
  - provinces-line
  - districts-hit
  - provinces-hit
  - districts-label
  - provinces-label
  attribution: IGN (ODC-By)
  source_ref: admin_boundaries
panels: []
click:
  title: Ucayali
  source: Sentinel-2 mosaic · 30 m
  admin:
    layers:
    - districts-hit
    - provinces-hit
    visible_layer: provinces-hit
    name_fields:
    - district
    - province
    iso: PER
    units:
      PER:
      - Province
      - District
overlays:
- id: veg_classes
  group: Vegetation
  title: Vegetation classes
  kind: style-layers
  swatch: '#55a05f'
  source_ref: veg_classes
  before: dim
  attribution: Cooley et al. (2024) vegetation typologies (CC0)
  sources:
    veg:
      type: geojson
      data:
        asset: vectors/veg_classes.geojson
  layers:
  - id: veg-fill
    type: fill
    source: veg
    paint:
      fill-color:
      - get
      - color
      fill-opacity: 0.72
  - id: veg-line
    type: line
    source: veg
    paint:
      line-color:
      - get
      - color
      line-width: 1.2
  legend:
    kind: classes
    title: Vegetation classes (co-produced with local experts)
    classes:
    - name: Palm swamps (aguajales) · Aguajales (3)
      color: '#5e9ea0'
    - name: Cloud forest · Bosque de colina alta (4)
      color: '#2e5d78'
    - name: Mature lowland forest · Bosque de colina baja (12)
      color: '#1b6b45'
    - name: Wetland forest · Bosque inundado (2)
      color: '#3f7f93'
    - name: Secondary or degraded lowland forest · Bosque secundario o degradado (216)
      color: '#55a05f'
    - name: Degraded shrubland or pasture · Pastizales o herbazales degradados (10)
      color: '#d8c26a'
    - name: Young vegetation regrowth (purma) · Purma (77)
      color: '#a9c977'
    notes:
    - >-
      Polygon counts are this app's analysis of the CC0 dataset. Class definitions: Cooley et al. (2024),
      Table 1.
    source: >-
      Cooley et al. (2021) vegetation typology dataset v4 (Feb 2022), CaltechDATA; classes co-produced
      with local experts in Ucayali · digitised on 2020/2021 imagery
  inspect:
    kind: feature-attributes
    layers:
    - veg-fill
    place: true
    title: '{class_en}'
    fields:
    - label: Class (local name)
      value: '{COBERTURA|spaces}'
    - label: Polygon
      value: '{PLOTID} · {area_ha|num} ha'
    - label: Digitised on
      value: '{MAPA_BASE} imagery, {ANO_IMAGEN}'
    notes:
    - >-
      Class co-produced with local experts; polygon from the CC0 dataset (doi:10.22002/D1.2318). Area
      is this app's analysis.
    - Cooley et al. (2024) · classes of the forest–agriculture interface
    empty_title: Ucayali
    empty: >-
      No digitised polygon here. The 324 polygons cover sampled patches, not the whole department.
- id: canopy
  group: Vegetation
  title: Canopy height
  kind: raster-tiles
  swatch: '#1f704a'
  source_ref: canopy
  asset: tiles/canopy.pmtiles
  before: dim
  paint: &id007
    raster-resampling: nearest
    raster-opacity: 0.85
  attribution: ETH canopy height 2020 (CC BY 4.0)
  legend:
    kind: steps
    title: Canopy height 2020 (ETH, 10 m)
    colors: &id005
    - '#f0eee1'
    - '#cdd5ab'
    - '#9bbc86'
    - '#579a66'
    - '#1f704a'
    - '#06422b'
    labels:
    - 0 m
    - ≥ 40 m
    source: Lang et al. (2023) · CC BY 4.0 · model estimate; clicks read the 10 m raster
  inspect:
    kind: value-at-point
    asset: query/canopy_height_10m.tif
    title: Canopy height at {place}
    hint: >-
      ETH Global Canopy Height 2020, 10 m (GEDI + Sentinel-2 deep-learning fusion), six 3-degree tiles
      mosaicked and clipped to the department
    bands:
    - band: 0
      label: Canopy top height · 2020
      unit: m
      nodata:
      - 255
    facts:
    - label: Product
      value: ETH 10 m (GEDI + Sentinel-2)
    - label: Licence
      value: CC BY 4.0
    note: >-
      Model estimate, not a measurement: tall-canopy heights saturate and the map carries the model's
      uncertainty (a per-pixel SD layer exists upstream). Display tiles are averaged to ~38 m at z12;
      clicks read the 10 m raster.
- id: gedi
  group: Vegetation
  title: GEDI lidar canopy height
  kind: style-layers
  swatch: '#579a66'
  source_ref: gedi
  before: dim
  attribution: NASA GEDI L2A v002
  sources:
    gedi-grid:
      type: raster
      url:
        pmtiles: tiles/gedi_grid.pmtiles
      tileSize: 256
    gedi-fp:
      type: vector
      url:
        pmtiles: tiles/gedi_footprints.pmtiles
  layers:
  - id: gedi-grid-tiles
    type: raster
    source: gedi-grid
    paint:
      raster-resampling: nearest
      raster-opacity:
      - interpolate
      - - linear
      - - zoom
      - 9
      - 0.85
      - 11.5
      - 0
  - id: gedi-fp
    type: circle
    source: gedi-fp
    source-layer: footprints
    minzoom: 9
    paint:
      circle-radius:
      - interpolate
      - - exponential
        - 2
      - - zoom
      - 9
      - 1.6
      - 12
      - 3.8
      - 14
      - 4.8
      - 16
      - 5.3
      - 18
      - 21.2
      circle-color:
      - interpolate
      - - linear
      - - get
        - rh95
      - 0
      - '#f0eee1'
      - 50
      - '#cdd5ab'
      - 100
      - '#9bbc86'
      - 200
      - '#579a66'
      - 300
      - '#1f704a'
      - 400
      - '#06422b'
      circle-stroke-color: rgba(255,255,255,0.7)
      circle-stroke-width:
      - interpolate
      - - linear
      - - zoom
      - 9
      - 0.3
      - 13
      - 0.7
  legend:
    kind: steps
    title: GEDI canopy height (RH95)
    colors: *id005
    labels:
    - 0 m
    - ≥ 40 m
    notes:
    - 'Transparent 1 km cell: no valid GEDI shot in it (the imagery shows through).'
    source: >-
      1,506,194 footprints, 2019-04-20 to 2025-07-09 · zoomed out: 1 km mean; from zoom 9: one dot per
      25 m footprint (a sample at zooms 9–10) · strict quality set, this app's analysis · NASA GEDI L2A
      v002
  inspect:
    kind: combined
    target: panel
    hint: >-
      NASA GEDI L2A (GEDI02_A v002), full-power beams; the paper's filters (Cooley et al. 2024, sect.
      2.4) plus quality_flag = 1 and degrade_flag = 0 (this app's strict set)
    parts:
    - kind: feature-attributes
      layers:
      - gedi-fp
      radius: 8
      nearest: true
      optional: true
      as: kpis
      title: GEDI footprint
      fields:
      - label: RH95 · this footprint
        value: '{rh95|scale:0.1|fixed:1}'
        unit: m
      - label: RH50
        value: '{rh50|scale:0.1|fixed:1}'
        unit: m
      - label: Date
        value: '{date|date8}'
    - kind: value-at-point
      asset: query/gedi_rh95_1km.tif
      title: GEDI at {place}
      bands:
      - band: 0
        label: Mean RH95 · 1 km cell
        unit: m
        scale: 0.1
        decimals: 1
        nodata:
        - -32768
        nodata_text: no valid shot
      - band: 1
        label: Shots in the cell
        nodata:
        - -32768
        nodata_text: '0'
      notes:
      - Zoom in to 9 or closer and click a dot to read one footprint.
    note: >-
      This app's analysis. Each dot is one 25 m footprint, located to about ±10 m. Zoomed out, a 1 km
      grid shows the mean RH95 of the shots in each cell; at zooms 9-10 the dots are a random sample.
      RH95 is GEDI's own value (no ground-return transformation, unlike the paper's Table 2a).
- id: landcover
  group: Land
  title: Land cover
  kind: year-tiles
  swatch: '#e49635'
  source_ref: landcover
  before: dim
  attribution: MapBiomas Perú C4 (CC BY 4.0)
  paint:
    raster-resampling: nearest
    raster-opacity: 0.8
  years:
    '2000': tiles/lulc_2000.pmtiles
    '2005': tiles/lulc_2005.pmtiles
    '2010': tiles/lulc_2010.pmtiles
    '2015': tiles/lulc_2015.pmtiles
    '2020': tiles/lulc_2020.pmtiles
    '2024': tiles/lulc_2024.pmtiles
  time_caption: land cover (MapBiomas C4)
  legend:
    kind: classes
    title: Land cover {year} (MapBiomas Perú C4)
    classes: &id006
    - value: 3
      name: Forest · Bosque
      color: '#1f8d49'
    - value: 4
      name: Dry forest · Bosque seco
      color: '#7dc975'
    - value: 6
      name: Flooded forest · Bosque inundable
      color: '#026975'
    - value: 12
      name: Herbaceous formation · Formación herbácea
      color: '#d6bc74'
    - value: 15
      name: Pasture (beta) · Pasto (beta)
      color: '#edde8e'
    - value: 21
      name: Mosaic of agriculture and pasture · Mosaico agropecuario
      color: '#ffefc3'
    - value: 23
      name: Beach · Playa
      color: '#ffa07a'
    - value: 24
      name: Urban infrastructure · Infraestructura urbana
      color: '#d4271e'
    - value: 25
      name: Other anthropogenic non-vegetated area · Otra área antrópica sin vegetación
      color: '#db4d4f'
    - value: 27
      name: Not observed · No observado
      color: '#ffffff'
    - value: 30
      name: Mining · Minería
      color: '#9c0027'
    - value: 33
      name: River, lake or ocean · Río, lago u océano
      color: '#2532e4'
    - value: 35
      name: Oil palm · Palma aceitera
      color: '#9065d0'
    - value: 40
      name: Rice (beta) · Arroz (beta)
      color: '#c71585'
    - value: 51
      name: Lowland flooded grassland · Herbazal inundable de tierras bajas
      color: '#5faf92'
    - value: 66
      name: Shrubland and other shrub vegetation · Matorral y otros arbustales
      color: '#a89358'
    - value: 68
      name: Other natural non-vegetated area · Otra área natural sin vegetación
      color: '#e97a7a'
    source: >-
      30 m · CC BY 4.0 · official palette · cacao has no class of its own (inside 'Mosaico agropecuario')
  inspect:
    kind: class-at-point
    asset: query/lulc_stack_30m.tif
    band_per_year: true
    classes: *id006
    title: Land cover at {place}
    hint: MapBiomas Perú Collection 4 (Landsat, 30 m), national rasters clipped to Ucayali
    area_series:
      file: series/lulc_areas.json
      path:
      - areas
      - '{year}'
      key: value
      label: Department area of class
      unit: km²
    note: >-
      Oil palm is its own class (35, Palma aceitera); cacao and other specific crops have no class and
      fall inside 'Mosaico agropecuario' (21) - relevant when relating classes to Cooley et al. (2024).
      Class areas are this app's analysis.
- id: forest_loss
  group: Land
  title: Forest loss
  kind: raster-tiles
  swatch: '#b2182b'
  source_ref: forest_loss
  asset: tiles/forest_loss.pmtiles
  before: dim
  paint: *id007
  attribution: GEOBOSQUES (MINAM/SERFOR)
  legend:
    kind: classes
    title: Forest & loss (GEOBOSQUES)
    classes:
    - value: 1
      name: Water · Hidrografía
      color: '#2e5573'
    - value: 2
      name: Humid Amazon forest (remaining in 2024) · Bosque 2024
      color: '#1f6b45'
    - value: 3
      name: Forest loss 2001–2024 · Pérdida 2001–2024
