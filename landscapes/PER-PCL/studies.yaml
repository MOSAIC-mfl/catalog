    Ucayali in Iparia district (Coronel Portillo); the river is the blue class.
- id: swat_amazon_model
  kind: explore
  question: Could land-use change in Ucayali be linked to river flows and sediment with a model?
  finding: >-
    SWAT-Amazon v1.0 is the regionally adapted SWAT2012 used by Santini et al. (2026): a Fortran executable
    plus an R workflow, adding Muskingum-with-variable-K, kinematic- and diffusive-wave routing and new
    sand/fine-sediment routing modules built for Amazonian floodplains (repository README). It could be
    used to study how forest loss affects water and sediment downstream; nothing from the model is shown
    in this app.
  caveat: >-
    A model framework, not a finding — nothing from it is shown on this map yet. Version in bibliography:
    SWAT-Amazon v1.0 (william-santini/SWAT-Amazon, commit 231c5e5).
  citation: >-
    Santini, W. SWAT-Amazon v1.0 (github.com/william-santini/SWAT-Amazon); described in Santini et al.
    (2026), HESS 30:3367–3397
  doi: 10.5194/hess-30-3367-2026
  layers:
  - forest_loss
  camera:
    lng: -74.6
    lat: -8.8
    zoom: 8
    pitch: 0
