[project]
name = "mosaic-catalog"
version = "0.2.0"
description = "MOSAIC metadata standard, records and catalogue build"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.21", "referencing>=0.35", "pyyaml>=6.0"]

[project.optional-dependencies]
infer = ["pyshp>=2.3"]
dev = ["pyshp>=2.3", "pytest>=8", "openpyxl>=3.1", "ruff>=0.6", "mypy>=1.10", "types-PyYAML", "types-jsonschema"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"scripts/build_vocab.py" = ["E501"]  # vocabulary tables read better on one line
"scripts/build_reference.py" = ["E501"]  # sheet texts read better on one line

[tool.mypy]
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["shapefile"]
ignore_missing_imports = true
