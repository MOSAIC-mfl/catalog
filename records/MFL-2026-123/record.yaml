# MOSAIC record (standard v0.2). A source of the MOSAIC map explorers (landscapes/*/sources.yaml), from their DATA_REPORT.md.
schema_version: 0.2.0
id: MFL-2026-123
title: Global Forest Change 2000-2025, version 1.13 (Hansen/UMD)
description: >-
  Tree cover in 2000 and the year of gross tree-cover loss, 2001-2025, at 30 m from Landsat (Hansen et al. 2013;
  version GFC-2025-v1.13). Tree-cover loss is not deforestation: it includes plantation and woodlot harvest. Detection
  improved around 2011-2013, so annual values before and after are not strictly comparable. The MOSAIC Lake Victoria
  Basin explorer counts loss where tree cover in 2000 was at least 30 %.
