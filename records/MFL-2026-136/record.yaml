schema_version: 0.2.0
id: MFL-2026-136
title: 'National Censuses 2025 (population, housing and Indigenous communities): final results by province and district, Ucayali'
description: >-
  'Censos Nacionales 2025: XIII de Población, VIII de Vivienda y IV de Comunidades Indígenas', the de jure national
  census of Peru by the Instituto Nacional de Estadística e Informática (INEI): final results for Ucayali department
  in 11 workbooks (102 tables) by province and district. Population: demographic indicators (enumerated and omitted
  population, five-year migration, place of birth), fertility, marital status, identity documents and health
  insurance, education and ICT use, disability, ethnicity and languages, working-age population. Housing: dwelling
  characteristics and basic services (water source and distribution, time to fetch water, days and hours of service,
  sanitation, source of electricity, meter). Household: tenure, cooking fuel, waste disposal, emigration, disability,
  equipment, ICT and transport. Fieldwork ran from 4 August to 31 October 2025 (reference day 15 September 2025).
  The tables follow the official boundaries as at 15 July 2026, with Huipoca and Boquerón as districts.
