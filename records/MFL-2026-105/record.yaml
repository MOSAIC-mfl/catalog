title: Mbire – Lower Zambezi Valley living landscape boundary
description: >-
  Canonical MOSAIC delineation of the Mbire – Lower Zambezi Valley living landscape (ZWE-MB), used to
  define the landscape across the catalogue. Source: GADM 4.1, level 3: all 112 wards of the districts
  Mbire, Centenary/Muzarabani and Mount Darwin (Mashonaland Central) and Hurungwe (Mashonaland West),
  unmodified. Full-detail Shapefile and GeoPackage in the dated release boundaries-2026-10-14 of MOSAIC-mfl/catalog;
  a simplified outline is attached to the landscape's STAC collection.
