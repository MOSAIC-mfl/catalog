id: MFL-2026-055
title: Crop fields (2025) - focus on NUS crops
description: >-
  Amazonian tubers classified as Neglected and Underutilized Crop Species (NUS crops) in each farmers
  field, accurately documenting the characteristics of these species in situ. This process generated a
  comprehensive dataset comprising seven different crops: cassava (Manihot esculenta), sweet potato (Ipomoea
  batatas), aerial potato (Dioscorea bulbifera L.), achipa or chuin (Pachyrhizus tuberosus), pituca (Colocasia
  spp., Xanthosoma spp.), dale-dale (Calathea allouia), and sacha papa (Dioscorea bulbifera). Overall,
  the study captured the main characteristics of 683 varieties/404 species recorded across 273 mapped
  plots from 221 farmer households. The dataset is organized into: A) Household information, B) Field
  information and land-use history, C) Species names, D) Variety names, and E) Community collection points
  of NUS crops
