id: MFL-2026-057
title: Crop fields (2023)  focus on Banana, Pumpkins, Taro, Mustard
description: >-
  A total of 200 farmers in Vietnam, were surveyed utilizing ArcGIS Survey 123. Each farmer's field was
  physically visited, and the 'Participatory Mapping of Farmers' Fields' tool was employed to delineate
  polygons for each 'parcel', accurately determining their respective areas. This process captured the
  characteristics of 773 mapped plots across 200 farmers' households. The resultant comprehensive dataset
  comprises five distinct databases: A) Preliminary Information, B) Plot Information, C) Plot and Land
  Use, D) Crop Information, E) Variety Names. These datasets have been individualized and standardized
  using the common identifiers 'GlobalID Household' and 'GlobalID Plot'.
