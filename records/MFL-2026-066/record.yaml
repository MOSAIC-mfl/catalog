id: MFL-2026-066
title: iSDAsoil soil properties for the N'Zi watershed (0-20 and 20-50 cm)
description: >-
  Fifteen soil properties from iSDAsoil (iSDA), extracted by AfricaRice for the N'Zi watershed at about
  30 m, at 0-20 and 20-50 cm: bulk density, calcium, cation exchange capacity, clay, iron, potassium,
  magnesium, total nitrogen, phosphorus, pH, sulphur, sand, silt, soil organic carbon and zinc, in physical
  units. The public source is iSDAsoil for Africa.
