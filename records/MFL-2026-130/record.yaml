# MOSAIC record (standard v0.2). A source of the MOSAIC map explorers (landscapes/*/sources.yaml), from their DATA_REPORT.md.
schema_version: 0.2.0
id: MFL-2026-130
title: Peruvian Amazon humid forest map 2000-2024 (GEOBOSQUES)
description: >-
  National 30 m raster 'Mapa del Bosque Húmedo Amazónico Peruano, 2000-2024': water, forest in 2024, forest loss
  2001-2024, non-forest in 2000 and areas not monitored, from Landsat, by MINAM (PNCBMCC) and MIDAGRI (SERFOR),
  distributed through GEOBOSQUES. Loss includes natural and human-caused losses; losses from river-channel migration
  are excluded. The MOSAIC Ucayali explorer shows it masked to the department. MFL-2026-079 is derived from it,
  aggregated by province and district.
