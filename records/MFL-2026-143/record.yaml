# MOSAIC record (standard v0.2). A data source of the Peru evidence-to-action mapping (source PS-006), registered 2026-11-20 from INEI's microdata portal.
schema_version: 0.2.0
id: MFL-2026-143
title: National Household Survey on Living Conditions and Poverty (ENAHO)
description: >-
  'Encuesta Nacional de Hogares sobre Condiciones de Vida y Pobreza (ENAHO)', the continuous household survey of the
  Instituto Nacional de Estadística e Informática (INEI), run since May 2003 by direct interview. Microdata by module
  (32 in the 2025 edition): housing, household members, education, health, employment and income, expenditure,
  agriculture, livestock and forestry, summary variables, social programmes, participation, governance and food
  insecurity, among others. The sample is probabilistic, area-based, stratified and two-stage, independent in each
  department, partly a panel; in 2025, 36,594 dwellings in 5,359 clusters, of which 1,178 dwellings in 178 clusters in
  Ucayali. Estimates are representative each year for the country, urban and rural areas and each department
  (quarterly for the country, urban and rural areas only); records carry the district code, and module 100 the
  populated place and its coordinates. Indicators such as monetary poverty must be computed with the survey's
  expansion factors.
