# MOSAIC record (standard v0.2). A source of the MOSAIC map explorers (landscapes/*/sources.yaml), from their DATA_REPORT.md.
schema_version: 0.2.0
id: MFL-2026-128
title: Vegetation typology classification and data set in Ucayali, Peru (version 4.0)
description: >-
  324 polygons of vegetation types in Ucayali, Peru (mature lowland forest, secondary or degraded lowland forest,
  young regrowth (purma), degraded shrubland or pasture, cloud forest, palm swamps, wetland forest), digitised on
  2020/2021 imagery with local knowledge (Cooley et al. 2021, CaltechDATA). It is the basis of the GEDI canopy-height
  study of Cooley et al. (2024). Used in the MOSAIC Ucayali explorer.
