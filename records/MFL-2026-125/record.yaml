# MOSAIC record (standard v0.2). A source of the MOSAIC map explorers (landscapes/*/sources.yaml), from their DATA_REPORT.md.
schema_version: 0.2.0
id: MFL-2026-125
title: MODIS monthly burned area, MCD64A1 version 6.1
description: >-
  Monthly burned area from MODIS at ~500 m, with the approximate day of burning (Giglio et al. 2018). The MOSAIC
  Lake Victoria Basin explorer combines it, from the Microsoft Planetary Computer, into a yearly 'burned at least
  once' mask for 2001-2025. Small and low-intensity burns are missed, and cloud limits wet-season detection.
