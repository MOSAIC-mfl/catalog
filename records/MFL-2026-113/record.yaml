schema_version: 0.2.0
id: MFL-2026-113
title: Land productivity non-linear trends in the short growing season
description: >-
  Data show non-linear trends in land productivity during the short season (October to December) from
  1997 to 2024 in the Lake Victoria Basin (LVB), Kenya. Negative values indicate significant land degradation
  (browning), zero represents no significant trend, and positive values indicate significant land improvements
  (greening). Trends were derived from time series of bimonthly cloud-free Landsat imagery with 30 m spatial
  resolution. The ensemble empirical mode decomposition (EEMD) method was applied as a nonlinear approach
  to draw out the trend in monthly aggregated NDVI as an indicator of land productivity. The EEMD procedure
  was applied as follows: (1) add white noise of finite amplitude to the signal; (2) decompose the data
  plus the white noise into IMFs using EMD; (3) repeat the above steps with different sets of white noise
  each time; (4) find the mean of each IMF obtained in different trials to arrive at the final IMFs.
