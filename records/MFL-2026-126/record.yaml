# MOSAIC record (standard v0.2). A source of the MOSAIC map explorers (landscapes/*/sources.yaml), from their DATA_REPORT.md.
schema_version: 0.2.0
id: MFL-2026-126
title: Esri/Impact Observatory annual land use and land cover, version 2, 10 m
description: >-
  Annual nine-class land-use and land-cover maps at 10 m from Sentinel-2 and deep learning (Karra et al. 2021),
  version 2, 2017-2023 on the Microsoft Planetary Computer (io-lulc-annual-v02). The MOSAIC Lake Victoria Basin
  explorer shows it at 30 m. Global land-cover products disagree on cropland in sub-Saharan Africa (Kerner et al.
  2023): year-to-year change is indicative.
