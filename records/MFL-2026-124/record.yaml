# MOSAIC record (standard v0.2). A source of the MOSAIC map explorers (landscapes/*/sources.yaml), from their DATA_REPORT.md.
schema_version: 0.2.0
id: MFL-2026-124
title: NASA FIRMS VIIRS 375 m active fire detections
description: >-
  Active-fire detections from the VIIRS sensors at 375 m (S-NPP from 2012, NOAA-20 from 2020), distributed by NASA's
  Fire Information for Resource Management System (FIRMS), including yearly archives by country. The MOSAIC map
  explorers use detections of nominal and high confidence: yearly density per km2 on a ~1 km grid from S-NPP only,
  and individual points. Active fires are not burned area; cloud cover hides wet-season fires.
