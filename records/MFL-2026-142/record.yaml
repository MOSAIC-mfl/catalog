note: >-
  The descriptive report gives two accuracies (78 %, kappa 0.6, in its validation section; 60 % in its conclusions)
  and two totals of degraded area (2,175,983 ha excluding water bodies in the text; 2,285,580 ha on the map sheet and
  in the raster). The district rankings in the report do not include Huipoca and Boquerón, districts since 2021.
