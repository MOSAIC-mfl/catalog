# MOSAIC record (standard v0.2). A data source of the Peru evidence-to-action mapping (source PS-064), registered 2026-11-20 from the original files.
schema_version: 0.2.0
id: MFL-2026-142
title: Regional map of degraded areas in the terrestrial ecosystems of Ucayali
description: >-
  'Mapa Regional de Áreas Degradadas en Ecosistemas Terrestres del Departamento de Ucayali', approved by Ordenanza
  Regional N° 006-2023-GRU-CR. A 30 m raster of degraded areas by 2019, following MINAM's method aligned with UNCCD
  Land Degradation Neutrality. Three indicators are overlaid: the trend in land productivity (Landsat 5, 7 and 8 NDVI,
  1989-2019, Mann-Kendall test at 90 % confidence), Amazon forest loss 2000-2019 (PNCBMCC, GEOBOSQUES) and forest
  fragmentation (MSPA, PNCBMCC). The raster has six values: not degraded; forest fragmentation; loss of land
  productivity; productivity loss with forest loss; productivity loss with fragmentation; Amazon forest loss. The
  descriptive report also sorts degraded areas into nine categories by origin and intensity and ranks districts for
  two services (soil-erosion control, water provision and regulation); those appear only as figures and tables in the
  report. Produced by the Gobierno Regional de Ucayali (Autoridad Regional Ambiental) with MINAM technical assistance;
  regional working scale 1:50,000.
