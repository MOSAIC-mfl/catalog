id: MFL-2026-071
title: >-
  Urochloa hybrid adoption in Latin America and the Caribbean 2001-2024: An analysis of the land use,
  social, economic, and environmental impacts in 27 countries
description: >-
  Analysis of interspecific Urochloa forage-grass hybrid adoption across 27 Latin American and Caribbean
  countries, 2001-2024. Estimates over 1.09 million adopting farmers on 1.62 million cumulative hectares,
  projects cumulative forage value of US$47-62 billion by 2033, and estimates potential greenhouse gas
  emission reductions of 16.9-56.3 Mt CO2-eq by that timeframe.
