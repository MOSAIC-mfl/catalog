# MOSAIC record (standard v0.2). A source of the MOSAIC map explorers (landscapes/*/sources.yaml), from their DATA_REPORT.md.
schema_version: 0.2.0
id: MFL-2026-117
title: Observed flood frequency, Lake Victoria Basin, 2016-2025
description: >-
  Years flooded (0-10), flood frequency (flooded passes divided by valid Sentinel-1 observations) and share of observations
  excluded, per 20 m cell, 2016-2025, counted from the Copernicus Emergency Management Service Global Flood Monitoring
  (GFM) archive; no flood detection was re-implemented. Permanent water is removed; two radar artefacts (southern
  Rwanda, Serengeti-Mara) are masked. A flood-hazard proxy, not flood risk: flooded vegetation and urban areas are
  under-detected, and floods shorter than the 6-12-day revisit can be missed. Under internal review before external
  use (data report, 21 October 2026). Computed for the MOSAIC Lake Victoria Basin explorer.
