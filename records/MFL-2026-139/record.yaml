# MOSAIC record (standard v0.2). A data source of the Peru evidence-to-action mapping (source NS-004), registered 2026-11-20 from the SENAMHI pages.
schema_version: 0.2.0
id: MFL-2026-139
title: SENAMHI hydrological station Puente Aguaytía, daily river level
description: >-
  Conventional hydrological station 'Puente Aguaytía' (code 231201, category HLG) of the Servicio Nacional de
  Meteorología e Hidrología del Perú (SENAMHI, Dirección Zonal 10) on the Aguaytía River, Padre Abad district,
  Ucayali, at 278 m above sea level. River level is read three times a day (07, 13 and 19 h) and received in real
  time; the public station page shows the daily mean level for the last 30 days and a monthly table from January 2017
  (behind a robot check). Validated daily or monthly series of level, and of discharge where it exists, are supplied
  on request through SENAMHI's paid data service (TUSNE).
