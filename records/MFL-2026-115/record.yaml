schema_version: 0.2.0
id: MFL-2026-115
title: Livestock density trends (TLU/km²)
description: >-
  Spatial distribution of livestock density trends (TLU/km²) within the Kenyan extent of the Lake Victoria
  Basin, 2000–2022. Global Pasture Watch livestock data were processed for 2000–2022. The dominant livestock
  in the area (cattle, goats and sheep) were converted into tropical livestock units using 0.7 TLU per
  cattle head and 0.1 TLU per goat or sheep head. Annual trends were calculated from the annual 1 km livestock
  density rasters provided by Global Pasture Watch.
