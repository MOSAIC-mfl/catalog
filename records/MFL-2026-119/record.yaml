  - UGA
  - TZA
  landscapes:
  - KEN-LVB
temporal:
  start_date: '1992-10-17'
  update_frequency: unknown
license: CC-BY-NC-4.0
access: restricted
access_note: The time series is shown on the DAHITI target page; data downloads and the API need a DAHITI account.
contact:
