# MOSAIC record (standard v0.2). A source of the MOSAIC map explorers (landscapes/*/sources.yaml), from their DATA_REPORT.md.
schema_version: 0.2.0
id: MFL-2026-119
title: Lake Victoria water level from satellite altimetry (DAHITI)
description: >-
  Water-surface elevation of Lake Victoria (DAHITI target 2), each value with its uncertainty, from multi-mission
  satellite altimetry, about every 10 days from 17 October 1992. It shows the 2019-2020 rise and the record high
  of May 2024. Used in the MOSAIC Lake Victoria Basin explorer.
resource_type: dataset
themes:
- water-hydrology
spatial:
  geography:
