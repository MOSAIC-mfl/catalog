schema_version: 0.2.0
id: MFL-2026-112
title: Land productivity linear trends in the long growing season
description: >-
  Land productivity linear trends in the long growing season (March to June) from 1997 to 2024 in the
  Lake Victoria Basin (LVB) in Kenya. Trends were derived from time series of bimonthly cloud-free Landsat
  imagery with 30 m spatial resolution. A modified Mann-Kendall (MK) test and Sen’s slope estimator were
  utilized to determine the significance and magnitude of the trends, respectively. MK test assumes a
  monotonic linear trend, though, naturally, land productivity exhibit temporally differentiated discontinuities
  that may affect the estimation of the magnitude of the trend. Negative values indicate significant land
  degradation (browning), zero represents no significant trend, and positive values indicate significant
  land improvements (greening).
