id: MFL-2026-133
title: MapBiomas Perú Collection 4 annual land cover and land use
description: >-
  Annual land-cover and land-use maps of Peru at 30 m, 1985-2025 (MapBiomas Perú Collection 4), with classes such
  as forest, flooded forest, mosaic of agriculture and pasture, oil palm and urban infrastructure; cacao has no
  class of its own. The MOSAIC Ucayali explorer shows 2000, 2005, 2010, 2015, 2020 and 2024. MFL-2026-081 is derived
  from it, vectorised and aggregated by province and district.
