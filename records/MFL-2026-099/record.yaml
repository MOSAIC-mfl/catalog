id: MFL-2026-099
title: Cumbal (Nariño) living landscape boundary
description: >-
  Canonical MOSAIC delineation of the Cumbal (Nariño) living landscape (COL-CUM), used to define the landscape
  across the catalogue. Source: Nine veredas of the Cumbal indigenous reserve area (Tasmag, Quilismal,
  Boyera, Cuaical, Cuaspud Grande, Llano de Piedras, Cuetial, Guan, San Martin-Miraflores), layer 'Cumbal_veredas_wgs84'
  compiled by Javier Ochoa (CIP). Original source to be confirmed. Full-detail Shapefile and GeoPackage
  in the dated release boundaries-2026-10-14 of MOSAIC-mfl/catalog; a simplified outline is attached to
  the landscape's STAC collection.
