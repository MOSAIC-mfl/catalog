  across the catalogue. Source: Ethiopia River Basins (eth_basins), World Bank Group, World Bank Data
  Catalog dataset 0040202: Omo basin polygon (79,549 km2). Full-detail Shapefile and GeoPackage in the
  dated release boundaries-2026-10-14 of MOSAIC-mfl/catalog; a simplified outline is attached to the landscape's
  STAC collection.
