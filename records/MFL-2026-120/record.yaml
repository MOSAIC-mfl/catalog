# MOSAIC record (standard v0.2). A source of the MOSAIC map explorers (landscapes/*/sources.yaml), from their DATA_REPORT.md.
schema_version: 0.2.0
id: MFL-2026-120
title: Drought index SPI-3 from CHIRPS v3, Lake Victoria Basin
description: >-
  3-month Standardized Precipitation Index (McKee et al. 1993) per 0.05 degree cell, monthly from March 1981, computed
  from CHIRPS v3.0 monthly rainfall: gamma fit per cell and calendar month (Thom 1958) calibrated on 1991-2020,
  zero-rain months as a mixed distribution, values limited to plus or minus 3; class names after WMO (2012). The
  most recent 2-3 CHIRPS months are provisional. Computed for the MOSAIC Lake Victoria Basin explorer.
