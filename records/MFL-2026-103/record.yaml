citation: >-
  Contains referential census district limits of the Instituto Nacional de Estadistica e Informatica (INEI),
  Peru (ide.inei.gob.pe); the limits are referential and have no demarcation value. Changes: districts
  dissolved into one outline and Calleria clipped. No licence is stated by INEI (to be confirmed).
