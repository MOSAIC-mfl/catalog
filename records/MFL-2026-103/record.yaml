id: MFL-2026-103
title: Pucallpa – Ucayali living landscape boundary
description: >-
  Canonical MOSAIC delineation of the Pucallpa – Ucayali living landscape (PER-PCL), used to define the
  landscape across the catalogue. Source: INEI referential census district limits (cartography of the
  V Censo Nacional Economico 2022; 'Distrital' layer, ide.inei.gob.pe): 11 whole districts of Coronel
  Portillo and Padre Abad provinces (Ucayali) and a clipped part of Calleria. Full-detail Shapefile and
  GeoPackage in the dated release boundaries-2026-10-14 of MOSAIC-mfl/catalog; a simplified outline is
  attached to the landscape's STAC collection.
