id: MFL-2026-114
title: Spatial distribution of the CO₂ linear trends
description: >-
  Monotonic linear trends of CO₂ emissions within the Lake Victoria Basin (Kenya), 1997–2024. Annual CO₂
  emissions data from EDGAR were converted to emission density (tonnes/km²). Basin-wide trends were evaluated
  using the Hamed–Rao modified Mann–Kendall test with Sen’s slope to account for temporal autocorrelation.
  Total annual CO₂ emissions across the study area rose from about 1.95 million tonnes in 1997 to 4.80
  million tonnes in 2024, an increase of about 146.5%.
