# MOSAIC record (standard v0.2). A data source of the Peru evidence-to-action mapping (source PS-016), registered 2026-11-20 from the original site and files.
schema_version: 0.2.0
id: MFL-2026-138
title: Official Database of Indigenous or Original Peoples (BDPI), Indigenous localities
description: >-
  'Base de Datos Oficial de Pueblos Indígenas u Originarios (BDPI)' of Peru's Ministerio de Cultura, the State's
  official source of socio-demographic, qualitative and geographic information on Indigenous peoples (Ley 29785,
  Decreto Legislativo 1360). It covers 55 peoples (51 Amazonian, 4 Andean), 48 languages and 9,332 Indigenous
  localities nationally. The localities table has one row per locality: type (e.g. native community), people,
  department, province and district (ubigeo), recognition and titling resolutions and dates, whether it is
  georeferenced, area (ha), approximate population (speakers of an Indigenous language, self-identification, age
  groups, sex, households), housing gaps from the 2017 census (no water, sewerage or electricity) and nearby services
  (Tambos, police stations, health facilities, intercultural bilingual schools). Built from INEI censuses and surveys,
  the community directories of the regional agrarian offices, MINEDU and the ministry's own data. In Ucayali it lists
  481 localities: 145 in Coronel Portillo and 14 in Padre Abad. The BDPI states that it is not a register and does not
  create rights.
