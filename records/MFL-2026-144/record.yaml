# MOSAIC record (standard v0.2). A data source of the Peru evidence-to-action mapping (source NS-014), registered 2026-11-20 from the DATASS viewer.
schema_version: 0.2.0
id: MFL-2026-144
title: DATASS, rural water supply and sanitation diagnostic system (Peru)
description: >-
  'DATASS - Sistema de Diagnóstico sobre Abastecimiento de Agua y Saneamiento en el Ámbito Rural' of Peru's
  Ministerio de Vivienda, Construcción y Saneamiento (MVCS), approved by RM 063-2017-VIVIENDA. An administrative
  diagnostic of water and sanitation in rural populated places (up to 2,000 inhabitants), from a questionnaire that
  regional and local governments apply and keep up to date. The web viewer filters by department, province, district
  and populated place (10-digit INEI ubigeo) and groups indicators in seven themes: access, infrastructure, water
  quality, organisational management, cleaning, operation and maintenance and chlorination, economic and financial
  management, and technical assistance. Each indicator can be viewed as a table and exported to XLSX. For Ucayali,
  water coverage (indicator 7101) reports 366 populated places and 73.5 % of their people covered.
