id: MFL-2026-046
title: Climate station data (NHMS synoptic stations)
description: >-
  Daily weather data for three synoptic stations in and around the N'Zi watershed, served by AfricaRice's
  ARCWeather portal: Bouaké and Ferkessédougou from 1980 to 2010, Korhogo from 1994 to 2001. Korhogo holds
  fewer variables, and its dew point is estimated from the minimum temperature. AfricaRice's own M'Bé
  research-station data from 2014 onward is a separate record, MFL-2026-084.
