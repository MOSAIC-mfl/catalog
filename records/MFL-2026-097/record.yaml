id: MFL-2026-097
title: >-
  Data on the dynamics of Land Cover at different scales, Kef-Siliana region and sub-spatial units of
  the Agroecological Living Lab Landscape in Tunisia (2017-2022)
description: >-
  Land cover change statistics and the ecological degradation or improvement they imply, at two scales
  - the Kef-Siliana region as a whole and the sub-spatial units of the Agroecological Living Lab Landscape
  in Tunisia. Land cover change was analysed in QGIS 3.28.15 with the Semi-Automatic Classification Plugin;
  degradation and improvement were assessed following the UNCCD Good Practice Guidance. Delivered as two
  CSV tables with data dictionaries. Published on ICARDA's MEL data portal; MOSAIC links to it there.
