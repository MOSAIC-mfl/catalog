title: 'National Censuses 2017 (population, housing and Indigenous communities): final results for Ucayali'
description: >-
  'Censos Nacionales 2017: XII de Población, VII de Vivienda y III de Comunidades Indígenas', the de facto national
  census of Peru by the Instituto Nacional de Estadística e Informática (INEI), here the final results for Ucayali
  department ('Ucayali: Resultados Definitivos de los Censos Nacionales 2017', four volumes), with tables by province
  and district. Volume I covers general aspects, population, health insurance and education; volume II education,
  working-age population, religion, marital status and ethnic self-identification; volume III fertility; volume IV
  fertility and the dwelling and household tables (water source, hours and days of water service, payment for water,
  sanitation, electric lighting, building materials, tenure, household equipment, ICT, cooking fuel, emigration).
  Units are people, private dwellings and households. Urban areas were enumerated on 22 October 2017 and rural areas
  from 23 October to 6 November 2017. The online REDATAM system allows custom tables down to district; a separate
  directory gives population and dwellings by populated place, without coordinates.
