# MOSAIC record (standard v0.2). A data source of the Peru evidence-to-action mapping (source PS-026), registered 2026-11-20 from the original files.
schema_version: 0.2.0
id: MFL-2026-141
title: Regional ecosystem map of Ucayali department
description: >-
  'Mapa Regional de Ecosistemas del Departamento de Ucayali', the official ecosystem map of Ucayali approved by
  Ordenanza Regional N° 006-2023-GRU-CR. It maps 12 natural ecosystems (8 tropical lowland forest types, 2 yunga
  forests, lakes and rivers) and 4 intervened zones (secondary vegetation, agricultural, mining and urban areas) over
  10,507,617.8 ha, at a regional working scale of 1:50,000. Built by the Gobierno Regional de Ucayali (Autoridad
  Regional Ambiental, Dirección de Gestión del Territorio) in coordination with MINAM, from MINAM's national ecosystem
  map of 2018, refined with Landsat 2019 and 2020 imagery, palm swamps from the JICA wetland study and GEOBOSQUES, the
  1:100,000 national chart for water bodies, and the PNCBMCC land-use change map 2016 and MIDAGRI's agricultural-area
  map for intervened zones. The descriptive report gives the method, the classes and an office validation with 158
  points (overall accuracy 86.7 %, kappa 0.85).
