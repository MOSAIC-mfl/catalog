id: MFL-2026-096
title: >-
  Data on landscape metrics at different scales, Kef-Siliana region and sub-spatial units of the Agroecological
  Living Lab Landscape in Tunisia (2017-2022)
description: >-
  Landscape metrics computed from the 2017 and 2022 land cover maps of the Kef-Siliana region (MFL-2026-093
  and MFL-2026-094) with the LecoS plugin in QGIS 3.28.15, at two scales - the Kef-Siliana region as a
  whole and the sub-spatial units of the Agroecological Living Lab Landscape in Tunisia. Delivered as
  two CSV tables with data dictionaries. Published on ICARDA's MEL data portal; MOSAIC links to it there.
