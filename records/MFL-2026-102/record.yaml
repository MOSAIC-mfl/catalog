title: Lake Victoria Basin (Kenya) living landscape boundary
description: >-
  Canonical MOSAIC delineation of the Lake Victoria Basin (Kenya) living landscape (KEN-LVB), used to
  define the landscape across the catalogue. Source: OCHA COD-AB Kenya (IEBC), admin level 1: counties
  Kericho, Kisumu, Nandi, Siaya and Vihiga, dissolved into one outline (replaced the 4-county GADM outline
  on 2026-11-10). Full-detail Shapefile and GeoPackage in the dated release boundaries-2026-11-10 of
  MOSAIC-mfl/catalog; a simplified outline is attached to the landscape's STAC collection.
