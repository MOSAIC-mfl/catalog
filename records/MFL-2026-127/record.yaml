# MOSAIC record (standard v0.2). A source of the MOSAIC map explorers (landscapes/*/sources.yaml), from their DATA_REPORT.md.
schema_version: 0.2.0
id: MFL-2026-127
title: geoBoundaries open administrative boundaries (gbOpen)
description: >-
  Open administrative boundaries by country and level from the geoBoundaries database (Runfola et al. 2020). The
  MOSAIC Lake Victoria Basin explorer uses ADM1 and ADM2 of Kenya, Uganda, Tanzania, Rwanda and Burundi (50 ADM1
  and 311 ADM2 units), clipped to the basin. Boundaries are indicative, not an official delimitation; boundary years
  range from 2006 to 2021.
