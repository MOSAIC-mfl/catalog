# MOSAIC record (standard v0.2). A data source of the Peru evidence-to-action mapping (source PS-023), registered 2026-11-20 from Global Nature Watch and the GFW Data API metadata.
schema_version: 0.2.0
id: MFL-2026-137
title: Tree cover loss statistics for Ucayali and its provinces (Global Nature Watch, formerly Global Forest Watch)
description: >-
  Forest-change statistics for Ucayali department and its provinces (Atalaya, Coronel Portillo, Padre Abad, Purús) on
  Global Nature Watch, the platform of the World Resources Institute (WRI) known as Global Forest Watch until
  September 2026. The dashboards and the downloadable Peru statistics workbook give tree cover extent in 2000 and
  2010, annual tree cover loss 2001-2025 at canopy thresholds from 0 to 75 %, humid primary forest loss, loss by
  dominant driver, loss due to fire, natural forest in 2020 and its loss, and carbon stocks, emissions, removals and
  net flux, by country, department and province (GADM 4.1 boundaries). They are computed from Hansen/UMD Global
  Forest Change v1.13 (30 m), Turubanova et al. (2018) humid primary forest, the WRI/Google DeepMind drivers (Sims et
  al. 2025, 1 km), UMD/GLAD loss from fires (Tyukavina et al. 2022), the SBTN Natural Lands Map v1.1 and Harris et
  al. (2021, updated by Gibbs et al. 2025). Tree cover loss is not deforestation: it includes plantation harvest and
  secondary forest. In 2001-2025, Padre Abad lost 280,233 ha of tree cover at the 30 % threshold.
