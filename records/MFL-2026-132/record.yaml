# MOSAIC record (standard v0.2). A source of the MOSAIC map explorers (landscapes/*/sources.yaml), from their DATA_REPORT.md.
schema_version: 0.2.0
id: MFL-2026-132
title: GEDI canopy height (RH95) footprints and 1 km grid, Ucayali, 2019-2025
description: >-
  Canopy height from GEDI L2A version 2 lidar footprints (RH95) inside the Ucayali department, 20 April 2019 to
  9 July 2025 (no shots April 2023 to April 2024). Shots are filtered as in Cooley et al. (2024), plus quality_flag
  = 1 and degrade_flag = 0: 1,506,194 footprints as vector tiles, and a 0.01 degree grid of mean RH95 and shot count,
  where 11.4 % of the department's cells have no valid shot. Shots above 60 m (0.15 %) are kept and flagged. Computed
  for the MOSAIC Ucayali explorer.
