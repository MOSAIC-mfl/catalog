# MOSAIC record (standard v0.2). A data source of the Peru evidence-to-action mapping (source NS-019), registered 2026-11-20 from CGSpace and CIP Dataverse.
schema_version: 0.2.0
id: MFL-2026-140
title: Collection of thematic maps for the Pucallpa–Aguaytía agroforestry corridor (CIP, 2025)
description: >-
  A collection of 73 spatial layers for the Pucallpa–Aguaytía agroforestry corridor (Padre Abad province and the
  districts of Nueva Requena, Campo Verde, Manantay and Yarinacocha; 14,064 km²) prepared by the International Potato
  Center: 48 rasters and 25 shapefiles in nine thematic groups (human footprint, climate change, protected areas,
  physiography, biomass and forest, ecosystem health and others). Most layers are clips of global or national sources
  (MapBiomas Perú land cover every five years 1985-2024, TerraClimate 2024 against 1981-2010, the Ecosystem Integrity
  Index, Hansen/GLAD forest loss 2000-2024, Sentinel-5P CO, NO2, O3 and SO2, and layers from MINAM, INEI, SERNANP,
  SENAMHI and IBC), at 30-90 m for the rasters. Published as a 35-page report of map figures on CGSpace, a CIP
  Dataverse dataset that holds the data dictionary, and an Earth Engine viewer.
