id: MFL-2026-095
title: Land Cover change in Kef-Siliana region (2017-2022)
description: >-
  Land cover change map of the Kef-Siliana region, Tunisia, between 2017 and 2022, derived from the two
  land cover maps (MFL-2026-093 and MFL-2026-094) with the Semi-Automatic Classification Plugin in QGIS
  3.28.15, 10 m cell size. Pixel values encode the 49 from-to transitions between the seven land cover
  classes (Water, Forest, Flooded vegetation, Crop, Built area, Bare land, Rangeland); the full key is
  in the deposit's data dictionary. Source data coordinate system UTM WGS 84; service coordinate system
  Web Mercator Auxiliary Sphere WGS 84 (EPSG:3857). Published on ICARDA's MEL data portal; MOSAIC links
  to it there.
