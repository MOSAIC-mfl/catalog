# Runs on every pull request: the standard (schemas, vocabularies, docs) and the records.
# Incomplete records do not fail the check; invalid records do.
name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check src scripts tests && ruff format --check src scripts tests
      - run: mypy src
      - run: python scripts/build_vocab.py --check
      - run: python scripts/build_docs.py --check
      - run: pytest -q
      - name: Records
        run: python -m mosaic_catalog validate records --gaps review/minimum_gaps
      - name: Landscape profiles
        run: python -m mosaic_catalog validate-landscapes
