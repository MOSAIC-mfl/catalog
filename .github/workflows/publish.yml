# Builds the catalogue with the MOSAIC standard (MOSAIC-mfl/mosaic-standard) and publishes dist/
# (catalog.json, manifest.json, landscapes/, and the standard's schema/, vocab/, crosswalks/) on
# GitHub Pages: https://mosaic-mfl.github.io/catalog/ . mosaic-api picks the changes up on its daily
# run (or when its workflow is run by hand).
name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0            # full history: created / updated come from git log
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install the standard
        env:
          STANDARD_REF: ${{ vars.STANDARD_REF || 'main' }}
        run: |
          git clone --quiet --depth 1 --branch "$STANDARD_REF" https://github.com/MOSAIC-mfl/mosaic-standard.git _standard
          pip install -e ./_standard   # editable: the tool reads schema/ and vocab/ from the checkout
      - run: python -m mosaic_catalog --catalog . build --out _site
      # Frozen STAC catalog of the first pipeline, kept at its old URL (mosaic-standard legacy/README.md).
      - run: cp -r _standard/legacy/stac _site/stac
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
