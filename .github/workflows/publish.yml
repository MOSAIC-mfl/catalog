# Builds the catalogue with the MOSAIC standard (MOSAIC-mfl/mosaic-standard) and publishes dist/
# (catalog.json, manifest.json, landscapes/, and the standard's schema/, vocab/, crosswalks/) on
# GitHub Pages: https://mosaic-mfl.github.io/catalog/ . Then notify-api asks mosaic-api to harvest
# it again at once (repository_dispatch "catalog-updated"), so the API and the website show the
# change without waiting for the API's daily run.
#
# notify-api authenticates as a GitHub App installed on MOSAIC-mfl/mosaic-api with the repository
# permission Contents: read and write (needed for repository_dispatch). Its settings live here:
#   variable  API_APP_CLIENT_ID     the App's Client ID
#   secret    API_APP_PRIVATE_KEY   a private key of the App (.pem contents)
# Until both are set the job only writes a notice and passes; the API then picks the change up on
# its daily run, as before.
name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0            # full history: created / updated come from git log
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install the standard
        env:
          STANDARD_REF: ${{ vars.STANDARD_REF || 'main' }}
        run: |
          git clone --quiet --depth 1 --branch "$STANDARD_REF" https://github.com/MOSAIC-mfl/mosaic-standard.git _standard
          pip install -e ./_standard   # editable: the tool reads schema/ and vocab/ from the checkout
      - run: python -m mosaic_catalog --catalog . build --out _site
      # Frozen STAC catalog of the first pipeline, kept at its old URL (mosaic-standard legacy/README.md).
      - run: cp -r _standard/legacy/stac _site/stac
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
  notify-api:
    needs: deploy
    runs-on: ubuntu-latest
    permissions: {}
    env:
      HAS_APP: ${{ vars.API_APP_CLIENT_ID != '' && secrets.API_APP_PRIVATE_KEY != '' }}
    steps:
      - name: No GitHub App configured
        if: env.HAS_APP != 'true'
        run: echo "::notice title=mosaic-api not notified::Set the variable API_APP_CLIENT_ID and the secret API_APP_PRIVATE_KEY (see the header of this workflow). mosaic-api picks this change up on its daily run."
      - name: Token for mosaic-api
        id: app
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.API_APP_CLIENT_ID }}
          private-key: ${{ secrets.API_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: mosaic-api
          permission-contents: write
      - name: Ask mosaic-api to harvest the catalogue
        if: env.HAS_APP == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          CATALOG_SHA: ${{ github.sha }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY_OWNER}/mosaic-api/dispatches" \
            -f event_type=catalog-updated \
            -f "client_payload[catalog_sha]=${CATALOG_SHA}"
          echo "::notice title=mosaic-api notified::Harvest requested for catalogue commit ${CATALOG_SHA}"
