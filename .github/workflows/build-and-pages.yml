name: Build and publish STAC catalog

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl==3.1.5 pyyaml==6.0.3
      # A failing test stops the job here: no build, no Pages upload, no deploy.
      - name: Unit tests (stdlib unittest)
        run: python3 -m unittest discover -s tests -t . -v
      - run: python3 build_catalog.py
      - name: Assemble Pages site
        run: |
          mkdir -p _site/stac
          cp -r stac/. _site/stac/
          cp datasets.json _site/stac/datasets.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
